<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="google-site-verification" content="1rNDahd3JgJCYe4UGAdNJqAAZM_oOawfSZ-I2i2_mPs" />
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="icon" href="https://raw.githubusercontent.com/JackTheDemon355/gamehub/refs/heads/main/favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="https://uploads.onecompiler.io/44md3ywr8/1790746237660/favicon%20(1).ico" type="image/x-icon">
<title>ROAD HOPPER — GAME HUB</title>
<style>
:root{--bg:#02020c;--cyan:#00fff2;--yellow:#ffe600;--green:#39ff14;--red:#ff003c;--mag:#ff2fd0;--sub:#b9c4cc;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);font-family:'Consolas','Courier New',monospace;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none;}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;}
#back{position:fixed;top:10px;left:10px;z-index:50;color:var(--cyan);text-decoration:none;border:1px solid var(--cyan);padding:6px 12px;font-size:11px;letter-spacing:2px;border-radius:4px;background:rgba(0,0,0,.7);}
#back:hover{background:var(--cyan);color:#000;}
#hud{display:flex;gap:18px;font-size:13px;letter-spacing:2px;padding:6px 10px;align-items:center;flex-wrap:wrap;justify-content:center;}
.lbl{color:var(--mag);}.val{color:var(--yellow);font-weight:bold;}
#timeBar{width:min(94vw,calc(100vh - 90px),600px);height:6px;background:#111;border-radius:3px;overflow:hidden;margin-bottom:4px;}
#timeFill{height:100%;width:100%;background:var(--green);transition:background .3s;}
#c{display:block;width:min(94vw,calc(100vh - 90px),600px);aspect-ratio:1/1;border:2px solid rgba(0,255,242,.25);box-shadow:0 0 36px rgba(0,255,242,.1);touch-action:none;}
#ov{position:fixed;inset:0;background:rgba(2,2,12,.95);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:8px;}
#ov h1{font-size:clamp(26px,7vw,52px);letter-spacing:8px;color:var(--green);text-shadow:0 0 14px var(--green),0 0 40px rgba(57,255,20,.4);}
#ov p{font-size:12px;color:var(--sub);max-width:440px;line-height:1.8;}
.btn{cursor:pointer;background:transparent;border:2px solid var(--yellow);color:var(--yellow);padding:11px 26px;font-family:inherit;font-size:14px;letter-spacing:3px;border-radius:4px;margin:4px;}
.btn:hover{background:var(--yellow);color:#000;}
</style>
</head>
<body>
<a id="back" href="index.html">◄ HUB</a>
<div id="hud">
  <span><span class="lbl">SCORE </span><span class="val" id="scoreEl">0</span></span>
  <span><span class="lbl">LIVES </span><span class="val" id="livesEl">3</span></span>
  <span><span class="lbl">LEVEL </span><span class="val" id="levelEl">1</span></span>
  <span><span class="lbl">HI </span><span class="val" id="hiEl">0</span></span>
</div>
<div id="timeBar"><div id="timeFill"></div></div>
<canvas id="c" width="520" height="520"></canvas>

<div id="ov">
  <h1>ROAD HOPPER</h1>
  <p style="color:var(--mag);letter-spacing:3px">◄ GET HOME SAFE ►</p>
  <p>Hop across the road without getting hit, then ride the logs and turtles over the river. Fill all 5 home bays to clear the level.</p>
  <p style="font-size:11px;color:#778">Arrow keys / WASD to hop · Turtles sink — don't get dunked!</p>
  <button class="btn" id="startBtn">▶ START</button>
</div>

<script>
(function(){
  // GAME HUB LOCK v4 — settings AND passwords come from lock.json (nothing hard-coded here)
  var CFG={};
  function norm(s){return String(s==null?'':s).trim().toLowerCase();}
  function isSchoolHours(){var n=new Date(),a=new Date(n.getTime()+28800000),d=a.getUTCDay();if(d===0||d===6)return false;var m=a.getUTCHours()*60+a.getUTCMinutes();return m>=495&&m<915;}
  function sha256(s){
    if(!(window.crypto&&window.crypto.subtle&&window.TextEncoder))return Promise.resolve(null);
    return window.crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2);}).join('');
    });
  }
  function passwordOk(v){
    v=norm(v);if(!v)return Promise.resolve(false);
    if((CFG.passwords||[]).map(norm).indexOf(v)>=0)return Promise.resolve(true);
    var hashes=(CFG.password_hashes||[]).map(norm);
    if(!hashes.length)return Promise.resolve(false);
    return sha256(v).then(function(h){return h!==null&&hashes.indexOf(h)>=0;});
  }
  function check(){
    fetch('lock.json?nc='+Date.now()).then(function(r){return r.json();}).then(function(d){
      CFG=d||{};
      if(CFG.locked===true||(CFG.school_hours_lock===true&&isSchoolHours()))showLock(CFG.message||'Locked.');
    }).catch(function(){});
  }
  function showLock(msg){
    var el=document.createElement('div');
    el.style.cssText='position:fixed;inset:0;background:#03030c;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Consolas,monospace;color:#00fff2;text-align:center;gap:14px;padding:24px;';
    el.innerHTML='<div style="font-size:clamp(26px,6vw,46px);color:#ff003c;letter-spacing:6px;font-weight:bold;text-shadow:0 0 16px #ff003c">LOCKED 🔒</div><div id="lkMsg" style="font-size:13px;color:#888;max-width:460px;line-height:1.7"></div><div style="font-size:11px;color:#334">Hold SHIFT + any key · or tap 3×</div>';
    el.querySelector('#lkMsg').textContent=msg;
    document.body.appendChild(el);document.body.style.overflow='hidden';
    var sh=false;
    function kd(e){if(e.key==='Shift'){sh=true;return;}if(sh){document.removeEventListener('keydown',kd);ask(el);}}
    document.addEventListener('keydown',kd);
    document.addEventListener('keyup',function(e){if(e.key==='Shift')sh=false;});
    var t=0,tc=0;
    el.addEventListener('click',function(){var n=Date.now();if(n-t>700)tc=0;t=n;if(++tc>=3){tc=0;ask(el);}});
  }
  function ask(el){
    el.innerHTML='<div style="font-size:clamp(22px,5vw,34px);color:#ffe600;letter-spacing:6px;font-weight:bold">PASSWORD 🔑</div><input id="lpi" type="password" autocomplete="off" spellcheck="false" style="background:rgba(0,0,0,.65);border:2px solid rgba(0,255,242,.4);color:#fff;padding:13px 20px;font-family:Consolas,monospace;font-size:20px;letter-spacing:6px;border-radius:6px;outline:none;width:280px;max-width:90vw;text-align:center;" placeholder="••••••••"><button id="lpb" style="background:transparent;color:#00fff2;border:2px solid #00fff2;padding:11px 28px;font-family:Consolas,monospace;font-size:14px;letter-spacing:3px;border-radius:4px;cursor:pointer;margin-top:4px;">▶ UNLOCK</button><div id="lpe" style="color:#ff003c;font-size:12px;min-height:18px;"></div>';
    var i=el.querySelector('#lpi'),b=el.querySelector('#lpb'),e=el.querySelector('#lpe');i.focus();
    function go(){
      passwordOk(i.value).then(function(good){
        if(good){el.remove();document.body.style.overflow='';}
        else{e.textContent='Incorrect';i.value='';i.focus();setTimeout(function(){e.textContent='';},2200);}
      });
    }
    b.addEventListener('click',go);
    i.addEventListener('keydown',function(ev){if(ev.key==='Enter')go();});
  }
  check();
})();


const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=520,H=520,CELL=40,COLS=13,ROWS=13;
const BAYS=[1,4,6,8,11];                  // goal bay columns (symmetric)
// row 0 goal · rows 1-5 river · row 6 median · rows 7-11 road · row 12 start
const LANE_DEFS=[
  {row:1,kind:'log',   dir: 1,speed:45, w:3,gap:3.5},
  {row:2,kind:'turtle',dir:-1,speed:55, w:2,gap:3},
  {row:3,kind:'log',   dir: 1,speed:70, w:4,gap:3},
  {row:4,kind:'log',   dir:-1,speed:40, w:2,gap:3},
  {row:5,kind:'turtle',dir: 1,speed:50, w:3,gap:3.5},
  {row:7, kind:'car',  dir:-1,speed:60, w:1,gap:4,   color:'#ff2fd0'},
  {row:8, kind:'car',  dir: 1,speed:85, w:1,gap:4.5, color:'#ffe600'},
  {row:9, kind:'truck',dir:-1,speed:50, w:2,gap:4.5, color:'#ff6a00'},
  {row:10,kind:'car',  dir: 1,speed:110,w:1,gap:5.5, color:'#00fff2'},
  {row:11,kind:'car',  dir:-1,speed:70, w:1,gap:3.5, color:'#b46bff'}
];
let lanes=[],frog,score=0,lives=3,level=1,hi=0,state='menu',timeLeft=30,bays=[],bestRow=12,deadT=0,deadMsg='',clock=0,last=0;
try{hi=parseInt(localStorage.getItem('rh_hi'))||0;}catch(e){}
document.getElementById('hiEl').textContent=hi;

function buildLanes(){
  const mult=1+0.13*(level-1);
  lanes=LANE_DEFS.map((d,idx)=>{
    const period=(d.w+d.gap)*CELL;
    const n=Math.ceil((W+period*2)/period)+1;
    return Object.assign({},d,{speed:d.speed*mult,period,n,off:(idx*83)%period});
  });
}
function laneItems(l){
  const total=l.n*l.period,out=[];
  for(let i=0;i<l.n;i++){
    let x=((i*l.period+l.off)%total+total)%total-l.period;
    out.push({x,w:l.w*CELL});
  }
  return out;
}
function sinking(l,item){                       // turtle groups dip under water on a cycle
  if(l.kind!=='turtle')return false;
  const idx=Math.round((item.x+l.period*50)/l.period);
  const ph=((clock+idx*1.7+l.row)%7)/7;
  return ph>0.78;
}
function laneAt(row){return lanes.find(l=>l.row===row);}

function respawn(){
  frog={x:6*CELL+CELL/2,row:12};
  bestRow=12;timeLeft=Math.max(18,32-level*2);
}
function hud(){
  document.getElementById('scoreEl').textContent=score;
  document.getElementById('livesEl').textContent=lives;
  document.getElementById('levelEl').textContent=level;
  document.getElementById('hiEl').textContent=Math.max(hi,score);
}
function startGame(){
  score=0;lives=3;level=1;bays=[false,false,false,false,false];
  buildLanes();respawn();state='play';hud();
  document.getElementById('ov').style.display='none';
}
function die(why){
  if(state!=='play')return;
  state='dead';deadT=0.9;deadMsg=why;lives--;hud();
}
function afterDeath(){
  if(lives<=0){gameOver();return;}
  respawn();state='play';
}
function gameOver(){
  state='over';
  if(score>hi){hi=score;try{localStorage.setItem('rh_hi',String(hi));}catch(e){}}
  const ov=document.getElementById('ov');ov.style.display='flex';
  ov.innerHTML='<h1 style="color:var(--red);text-shadow:0 0 14px var(--red)">GAME OVER</h1>'
   +'<div style="font-size:38px;color:var(--yellow);font-weight:bold">'+score+'</div>'
   +'<p>Level '+level+' · Hi '+hi+'</p><button class="btn" id="againBtn">↻ PLAY AGAIN</button>'
   +'<a href="index.html" style="color:var(--cyan);font-size:11px;letter-spacing:2px;text-decoration:none">◄ GAME HUB</a>';
  document.getElementById('againBtn').onclick=startGame;
  hud();
}

function hop(dx,dy){
  if(state!=='play')return;
  const nr=frog.row+dy;
  if(nr<0||nr>=ROWS)return;
  let nx=frog.x+dx*CELL;
  if(nx<0||nx>W)return;
  frog.row=nr;
  if(!isRiver(nr)&&nr!==0)nx=Math.round((nx-CELL/2)/CELL)*CELL+CELL/2;   // snap to the grid off the river
  frog.x=nx;
  if(nr<bestRow){bestRow=nr;score+=10;hud();}
  if(nr===0)reachGoal();
}
function isRiver(r){return r>=1&&r<=5;}
function reachGoal(){
  const col=Math.round((frog.x-CELL/2)/CELL);
  const bi=BAYS.indexOf(col);
  if(bi<0||bays[bi]||Math.abs(frog.x-(col*CELL+CELL/2))>CELL*0.55){die('MISSED THE BAY');return;}
  bays[bi]=true;
  score+=50+Math.round(timeLeft)*2;hud();
  if(bays.every(Boolean)){
    score+=500;level++;lives=Math.min(5,lives+1);
    bays=[false,false,false,false,false];buildLanes();
  }
  respawn();hud();
}

function update(dt){
  clock+=dt;
  if(state==='dead'){deadT-=dt;if(deadT<=0)afterDeath();return;}
  if(state!=='play')return;
  lanes.forEach(l=>{l.off+=l.dir*l.speed*dt;});
  timeLeft-=dt;
  if(timeLeft<=0){die('OUT OF TIME');return;}
  const r=frog.row;
  if(isRiver(r)){
    const l=laneAt(r);
    const item=laneItems(l).find(it=>frog.x>=it.x+4&&frog.x<=it.x+it.w-4&&!sinking(l,it));
    if(!item){die('SPLASH!');return;}
    frog.x+=l.dir*l.speed*dt;
    if(frog.x<0||frog.x>W){die('CARRIED AWAY');return;}
  }else if(r>=7&&r<=11){
    const l=laneAt(r);
    for(const it of laneItems(l)){
      if(frog.x+12>it.x+4&&frog.x-12<it.x+it.w-4){die('SPLAT!');return;}
    }
  }
}

// ── drawing ──
function drawFrog(x,y,dead){
  ctx.save();ctx.translate(x,y);
  ctx.shadowColor=dead?'#ff003c':'#39ff14';ctx.shadowBlur=14;
  ctx.fillStyle=dead?'#ff003c':'#39ff14';
  ctx.beginPath();ctx.ellipse(0,2,13,11,0,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-7,-7,4,0,Math.PI*2);ctx.arc(7,-7,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.arc(-7,-8,2,0,Math.PI*2);ctx.arc(7,-8,2,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function draw(){
  ctx.fillStyle='#02020c';ctx.fillRect(0,0,W,H);
  // goal row + bays
  ctx.fillStyle='#08210f';ctx.fillRect(0,0,W,CELL);
  for(let c=0;c<COLS;c++){
    const bi=BAYS.indexOf(c);
    if(bi<0){ctx.fillStyle='#0d3a18';ctx.fillRect(c*CELL,0,CELL,CELL);}
    else{
      ctx.strokeStyle='#39ff14';ctx.lineWidth=2;ctx.shadowColor='#39ff14';ctx.shadowBlur=8;
      ctx.strokeRect(c*CELL+3,4,CELL-6,CELL-8);ctx.shadowBlur=0;
      if(bays[bi])drawFrog(c*CELL+CELL/2,CELL/2,false);
    }
  }
  // river
  ctx.fillStyle='#04163a';ctx.fillRect(0,CELL,W,5*CELL);
  ctx.strokeStyle='rgba(0,170,255,.12)';ctx.lineWidth=1;
  for(let r=1;r<=5;r++)for(let x=-((clock*14)%30);x<W;x+=30){ctx.beginPath();ctx.moveTo(x,r*CELL+14);ctx.quadraticCurveTo(x+8,r*CELL+9,x+15,r*CELL+14);ctx.stroke();}
  // median + start
  ctx.fillStyle='#0b2a14';ctx.fillRect(0,6*CELL,W,CELL);ctx.fillRect(0,12*CELL,W,CELL);
  // road
  ctx.fillStyle='#0c0c14';ctx.fillRect(0,7*CELL,W,5*CELL);
  ctx.strokeStyle='rgba(255,230,0,.25)';ctx.lineWidth=2;ctx.setLineDash([16,16]);
  for(let r=8;r<=11;r++){ctx.beginPath();ctx.moveTo(0,r*CELL);ctx.lineTo(W,r*CELL);ctx.stroke();}
  ctx.setLineDash([]);
  // lane items
  lanes.forEach(l=>{
    const y=l.row*CELL;
    laneItems(l).forEach(it=>{
      if(it.x>W||it.x+it.w<0)return;
      if(l.kind==='log'){
        ctx.fillStyle='rgba(160,100,40,.55)';ctx.strokeStyle='#d99a4a';ctx.lineWidth=2;ctx.shadowColor='#d99a4a';ctx.shadowBlur=8;
        ctx.fillRect(it.x+2,y+6,it.w-4,CELL-12);ctx.strokeRect(it.x+2,y+6,it.w-4,CELL-12);ctx.shadowBlur=0;
      }else if(l.kind==='turtle'){
        const sunk=sinking(l,it);
        ctx.globalAlpha=sunk?.25:1;
        for(let k=0;k<l.w;k++){
          ctx.fillStyle='#1fbf6a';ctx.shadowColor='#39ff14';ctx.shadowBlur=sunk?0:8;
          ctx.beginPath();ctx.arc(it.x+k*CELL+CELL/2,y+CELL/2,14,0,Math.PI*2);ctx.fill();
          ctx.shadowBlur=0;ctx.strokeStyle='#0d6b3a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(it.x+k*CELL+CELL/2,y+CELL/2,8,0,Math.PI*2);ctx.stroke();
        }
        ctx.globalAlpha=1;
      }else{
        ctx.fillStyle=l.color;ctx.shadowColor=l.color;ctx.shadowBlur=12;
        ctx.fillRect(it.x+3,y+8,it.w-6,CELL-16);ctx.shadowBlur=0;
        ctx.fillStyle='rgba(255,255,255,.75)';
        const hx=l.dir>0?it.x+it.w-8:it.x+4;
        ctx.fillRect(hx,y+11,4,5);ctx.fillRect(hx,y+CELL-16,4,5);
      }
    });
  });
  // frog
  if(frog&&(state==='play'||state==='dead')){
    const fy=frog.row*CELL+CELL/2;
    if(state==='dead'&&Math.floor(deadT*10)%2===0)drawFrog(frog.x,fy,true);
    else if(state==='play')drawFrog(frog.x,fy,false);
  }
  if(state==='dead'){
    ctx.fillStyle='#ff003c';ctx.shadowColor='#ff003c';ctx.shadowBlur=12;ctx.font='bold 26px Consolas,monospace';ctx.textAlign='center';
    ctx.fillText(deadMsg,W/2,H/2);ctx.shadowBlur=0;
  }
  // timer bar
  const f=document.getElementById('timeFill'),maxT=Math.max(18,32-level*2),pct=Math.max(0,timeLeft/maxT);
  f.style.width=(pct*100)+'%';f.style.background=pct>.5?'#39ff14':pct>.25?'#ffe600':'#ff003c';
}

function loop(ts){
  if(!last)last=ts;
  const dt=Math.min((ts-last)/1000,.05);last=ts;
  update(dt);draw();requestAnimationFrame(loop);
}

// ── input ──
document.addEventListener('keydown',e=>{
  if(e.repeat)return;
  const k=e.key;
  if(k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();hop(0,-1);}
  else if(k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();hop(0,1);}
  else if(k==='ArrowLeft'||k==='a'||k==='A'){e.preventDefault();hop(-1,0);}
  else if(k==='ArrowRight'||k==='d'||k==='D'){e.preventDefault();hop(1,0);}
});
document.getElementById('startBtn').onclick=startGame;
buildLanes();respawn();hud();
requestAnimationFrame(loop);
</script>
</body>
</html>
