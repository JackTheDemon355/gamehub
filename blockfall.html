<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOCK FALL</title>
<style>
  :root{--cyan:#00fff2;--magenta:#ff2fd0;--yellow:#ffe600;--green:#39ff14;--red:#ff003c;--orange:#ff6a00;--purple:#c940ff;--bg:#03030c;}
  html,body{margin:0;height:100%;background:var(--bg);font-family:'Consolas','Courier New',monospace;overflow:hidden;-webkit-user-select:none;user-select:none;color:var(--cyan);}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;gap:20px;}
  .sidebar{display:flex;flex-direction:column;gap:14px;min-width:120px;}
  .panel{background:rgba(0,255,242,.05);border:1px solid rgba(0,255,242,.2);border-radius:8px;padding:12px 14px;}
  .panel h3{margin:0 0 8px;font-size:10px;letter-spacing:3px;color:var(--magenta);}
  .pval{font-size:20px;color:var(--yellow);font-weight:bold;}
  .psmall{font-size:11px;color:#7af;line-height:1.9;}
  canvas{border:2px solid var(--cyan);box-shadow:0 0 40px rgba(0,255,242,.3);display:block;}
  #nextCv,#holdCv{display:block;margin:0 auto;}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;background:rgba(2,2,8,.93);z-index:10;padding:20px;}
  #overlay h1{font-size:clamp(28px,6vw,52px);margin:0;color:var(--cyan);letter-spacing:8px;
    text-shadow:0 0 16px var(--cyan),0 0 40px var(--cyan);animation:pulse 1.4s infinite;}
  #overlay h2{font-size:16px;margin:10px 0;color:var(--magenta);}
  #overlay p{color:#9fb0ba;font-size:13px;margin:4px 0;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.7;}}
  .fbtn{cursor:pointer;background:transparent;color:var(--yellow);border:2px solid var(--yellow);
    padding:11px 26px;font-family:inherit;font-size:15px;letter-spacing:3px;margin:6px;border-radius:4px;}
  .fbtn:hover{background:var(--yellow);color:#000;}
  #back{position:absolute;bottom:14px;left:18px;z-index:5;color:var(--cyan);text-decoration:none;
    border:1px solid var(--cyan);padding:7px 14px;font-size:12px;letter-spacing:2px;border-radius:4px;}
  #back:hover{background:var(--cyan);color:#000;}
  #touch{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:none;gap:8px;z-index:6;}
  #touch button{pointer-events:auto;width:54px;height:54px;border-radius:50%;font-size:18px;
    background:rgba(0,255,242,.12);border:2px solid var(--cyan);color:var(--cyan);}
  @media(max-width:700px){#touch{display:flex;}.sidebar{display:none;}}
</style>
</head>
<body>
<div id="wrap">
  <div class="sidebar">
    <div class="panel"><h3>HOLD</h3><canvas id="holdCv" width="100" height="80"></canvas></div>
    <div class="panel"><h3>SCORE</h3><div class="pval" id="sc">0</div></div>
    <div class="panel"><h3>LEVEL</h3><div class="pval" id="lv">1</div></div>
    <div class="panel"><h3>LINES</h3><div class="pval" id="lines">0</div></div>
    <div class="panel"><h3>COMBO</h3><div class="pval" id="combo">0</div></div>
  </div>

  <canvas id="c" width="300" height="600"></canvas>

  <div class="sidebar">
    <div class="panel"><h3>NEXT</h3><canvas id="nextCv" width="100" height="210"></canvas></div>
    <div class="panel">
      <h3>KEYS</h3>
      <div class="psmall">◄► Move<br>▲/Z Rotate<br>▼ Soft drop<br>SPC Hard drop<br>C Hold</div>
    </div>
  </div>
</div>

<a id="back" href="index.html">◄ HUB</a>

<div id="overlay">
  <h1>BLOCK FALL</h1>
  <h2>NEON TETRIS</h2>
  <p>◄ ► — move &nbsp;|&nbsp; ▲ / Z — rotate &nbsp;|&nbsp; ▼ — soft drop</p>
  <p>SPACE — hard drop &nbsp;|&nbsp; C — hold piece</p>
  <p style="margin-top:8px;font-size:12px;color:#556">Clear lines to level up. Combos multiply points.</p>
  <button class="fbtn" id="startBtn" style="margin-top:18px">▶ PLAY</button>
</div>

<div id="touch">
  <button id="tL">◀</button>
  <button id="tD">▼</button>
  <button id="tDrop">⬇</button>
  <button id="tR">▶</button>
  <button id="tRot">↻</button>
  <button id="tHold">C</button>
</div>

<script>
(function(){
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const nCv=document.getElementById('nextCv'),nCtx=nCv.getContext('2d');
const hCv=document.getElementById('holdCv'),hCtx=hCv.getContext('2d');
const W=cv.width,H=cv.height;
const COLS=10,ROWS=20,SZ=W/COLS; // SZ=30

const scEl=document.getElementById('sc'),lvEl=document.getElementById('lv'),
      linesEl=document.getElementById('lines'),comboEl=document.getElementById('combo'),
      overlay=document.getElementById('overlay');

// ---- Piece definitions (each rotation is a list of [row,col] offsets) ----
const PIECES={
  I:{color:'#00fff2',rotations:[[[0,0],[0,1],[0,2],[0,3]],[[0,2],[1,2],[2,2],[3,2]],[[2,0],[2,1],[2,2],[2,3]],[[0,1],[1,1],[2,1],[3,1]]]},
  O:{color:'#ffe600',rotations:[[[0,0],[0,1],[1,0],[1,1]]]},
  T:{color:'#c940ff',rotations:[[[0,1],[1,0],[1,1],[1,2]],[[0,0],[1,0],[2,0],[1,1]],[[1,0],[1,1],[1,2],[0,1]],[[0,1],[1,1],[2,1],[1,0]]]},
  S:{color:'#39ff14',rotations:[[[0,1],[0,2],[1,0],[1,1]],[[0,0],[1,0],[1,1],[2,1]]]},
  Z:{color:'#ff003c',rotations:[[[0,0],[0,1],[1,1],[1,2]],[[0,1],[1,0],[1,1],[2,0]]]},
  J:{color:'#ff6a00',rotations:[[[0,0],[1,0],[1,1],[1,2]],[[0,0],[0,1],[1,0],[2,0]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,0],[2,1]]]},
  L:{color:'#ff2fd0',rotations:[[[0,2],[1,0],[1,1],[1,2]],[[0,0],[1,0],[2,0],[2,1]],[[1,0],[1,1],[1,2],[2,0]],[[0,0],[0,1],[1,1],[2,1]]]}
};
const PKEYS=Object.keys(PIECES);

// ---- State ----
let board,score,level,lines,combo,running=false;
let cur,holdKey,canHold,bag,fallTimer,lockTimer,particles;

function emptyBoard(){return Array.from({length:ROWS},()=>new Array(COLS).fill(null));}

// 7-bag randomiser
let bagSrc=[];
function nextFromBag(){
  if(!bagSrc.length)bagSrc=[...PKEYS].sort(()=>Math.random()-.5);
  return bagSrc.pop();
}
function fillQueue(){while(bag.length<5)bag.push(nextFromBag());}

// ---- Piece helpers ----
function cells(key,rot){const p=PIECES[key];return p.rotations[rot%p.rotations.length];}

function valid(r,c,rot,key){
  for(const [dr,dc] of cells(key,rot)){
    const nr=r+dr,nc=c+dc;
    if(nr<0||nr>=ROWS||nc<0||nc>=COLS)return false;
    if(board[nr][nc])return false;
  }
  return true;
}

function spawnPiece(){
  fillQueue();
  const key=bag.shift();
  cur={key,rot:0,r:0,c:Math.floor(COLS/2)-2};
  if(!valid(cur.r,cur.c,cur.rot,cur.key)){
    cur=null;gameOver();
  }
  canHold=true;fallTimer=0;lockTimer=0;
}

function ghostR(){
  if(!cur)return 0;
  let gr=cur.r;
  while(valid(gr+1,cur.c,cur.rot,cur.key))gr++;
  return gr;
}

function rotate(dir){
  if(!cur)return;
  const nrot=(cur.rot+dir+PIECES[cur.key].rotations.length)%PIECES[cur.key].rotations.length;
  // wall-kick table (simplified)
  const kicks=[[0,0],[0,-1],[0,1],[0,-2],[0,2],[-1,0],[1,0]];
  for(const [dr,dc] of kicks){
    if(valid(cur.r+dr,cur.c+dc,nrot,cur.key)){cur.rot=nrot;cur.r+=dr;cur.c+=dc;lockTimer=0;return;}
  }
}

function moveH(d){
  if(!cur)return;
  if(valid(cur.r,cur.c+d,cur.rot,cur.key)){cur.c+=d;lockTimer=0;}
}

function softDrop(){
  if(!cur)return;
  if(valid(cur.r+1,cur.c,cur.rot,cur.key)){cur.r++;score+=1;scEl.textContent=score;fallTimer=0;}
}

function hardDrop(){
  if(!cur)return;
  let dropped=0;
  while(valid(cur.r+1,cur.c,cur.rot,cur.key)){cur.r++;dropped++;}
  score+=dropped*2;scEl.textContent=score;
  lock();
}

function holdPiece(){
  if(!cur||!canHold)return;
  canHold=false;
  const prevHold=holdKey;
  holdKey=cur.key;
  cur=null;
  if(prevHold){
    cur={key:prevHold,rot:0,r:0,c:Math.floor(COLS/2)-2};
    if(!valid(cur.r,cur.c,cur.rot,cur.key)){cur=null;gameOver();return;}
    fallTimer=0;lockTimer=0;
  }else{
    spawnPiece();
  }
}

function lock(){
  if(!cur)return;
  for(const [dr,dc] of cells(cur.key,cur.rot)){
    const nr=cur.r+dr,nc=cur.c+dc;
    if(nr>=0&&nr<ROWS)board[nr][nc]=PIECES[cur.key].color;
  }
  cur=null;
  clearLines();
  spawnPiece();
}

function clearLines(){
  let cleared=0;
  for(let r=ROWS-1;r>=0;){
    if(board[r].every(c=>c!==null)){
      for(let c=0;c<COLS;c++)pop(c*SZ+SZ/2,r*SZ+SZ/2,board[r][c],4);
      board.splice(r,1);board.unshift(new Array(COLS).fill(null));
      cleared++;
    }else r--;
  }
  if(cleared>0){
    combo++;
    const pts=[0,100,300,500,800][Math.min(cleared,4)];
    score+=Math.round(pts*(1+combo*0.5)*level);
    lines+=cleared;
    level=Math.floor(lines/10)+1;
    scEl.textContent=score;linesEl.textContent=lines;lvEl.textContent=level;comboEl.textContent=combo;
  }else{
    combo=0;comboEl.textContent=0;
  }
}

function pop(px,py,col,n){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=40+Math.random()*100;
    particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.55,color:col||'#fff',sz:2+Math.random()*3});}
}

function fallRate(){return Math.max(0.08,0.55-level*0.04);}

function gameOver(){
  running=false;
  overlay.innerHTML=`<h1 style="color:#ff003c;text-shadow:0 0 16px #ff003c">GAME OVER</h1>
    <h2>Level ${level} &nbsp;|&nbsp; ${lines} Lines</h2><p>Score: ${score}</p>
    <button class="fbtn" id="rb">↻ RETRY</button>
    <p style="margin-top:10px"><a href="index.html" style="color:var(--cyan)">◄ HUB</a></p>`;
  overlay.style.display='flex';
  document.getElementById('rb').onclick=()=>{overlay.style.display='none';startGame();};
}

function startGame(){
  board=emptyBoard();score=0;level=1;lines=0;combo=0;
  holdKey=null;canHold=true;bag=[];bagSrc=[];particles=[];
  fallTimer=0;lockTimer=0;cur=null;running=true;
  scEl.textContent=0;lvEl.textContent=1;linesEl.textContent=0;comboEl.textContent=0;
  fillQueue();spawnPiece();
}

// ---- Input ----
// DAS (Delayed Auto Shift)
const DAS_DELAY=0.16,ARR_RATE=0.05;
const dasState={left:0,right:0,leftHeld:false,rightHeld:false,downHeld:false};
const keyDown={};

addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key))e.preventDefault();
  if(keyDown[e.code])return; // already held
  keyDown[e.code]=true;
  if(!running)return;
  switch(e.code){
    case'ArrowLeft': case'KeyA': moveH(-1);dasState.leftHeld=true;dasState.left=DAS_DELAY;break;
    case'ArrowRight':case'KeyD': moveH(1);dasState.rightHeld=true;dasState.right=DAS_DELAY;break;
    case'ArrowDown': case'KeyS': dasState.downHeld=true;break;
    case'ArrowUp':case'KeyW':case'KeyZ': rotate(1);break;
    case'Space': hardDrop();break;
    case'KeyC':case'ShiftLeft':case'ShiftRight': holdPiece();break;
  }
});
addEventListener('keyup',e=>{
  keyDown[e.code]=false;
  switch(e.code){
    case'ArrowLeft':case'KeyA': dasState.leftHeld=false;dasState.left=0;break;
    case'ArrowRight':case'KeyD': dasState.rightHeld=false;dasState.right=0;break;
    case'ArrowDown':case'KeyS': dasState.downHeld=false;break;
  }
});

function bindTch(id,fn){const el=document.getElementById(id);if(!el)return;
  el.addEventListener('touchstart',e=>{e.preventDefault();if(running)fn();},{passive:false});}
bindTch('tL',()=>moveH(-1));bindTch('tR',()=>moveH(1));
bindTch('tD',softDrop);bindTch('tDrop',hardDrop);
bindTch('tRot',()=>rotate(1));bindTch('tHold',holdPiece);

// ---- Update ----
function update(dt){
  if(!cur)return;

  // DAS
  if(dasState.leftHeld){dasState.left-=dt;if(dasState.left<=0){moveH(-1);dasState.left=ARR_RATE;}}
  if(dasState.rightHeld){dasState.right-=dt;if(dasState.right<=0){moveH(1);dasState.right=ARR_RATE;}}
  if(dasState.downHeld)softDrop();

  // Gravity
  fallTimer+=dt;
  const fr=dasState.downHeld?Math.min(fallRate()*.1,.05):fallRate();
  if(fallTimer>=fr){
    fallTimer=0;
    if(valid(cur.r+1,cur.c,cur.rot,cur.key)){cur.r++;}
    else{
      lockTimer+=fr;
      if(lockTimer>=0.5)lock();
    }
  }

  // Particles
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.93;p.vy*=.93;}
  particles=particles.filter(p=>p.life>0);
}

// ---- Draw ----
function drawCell(c2d,col,r,c,alpha){
  c2d.globalAlpha=alpha||1;
  c2d.fillStyle=col+'28';c2d.fillRect(c*SZ+1,r*SZ+1,SZ-2,SZ-2);
  c2d.strokeStyle=col;c2d.lineWidth=1.5;c2d.shadowColor=col;c2d.shadowBlur=5;
  c2d.strokeRect(c*SZ+1,r*SZ+1,SZ-2,SZ-2);c2d.shadowBlur=0;c2d.globalAlpha=1;
}

function drawMini(c2d,key,cw,ch){
  c2d.fillStyle='#03030c';c2d.fillRect(0,0,cw,ch);
  if(!key)return;
  const rots=cells(key,0);const col=PIECES[key].color;
  const minR=Math.min(...rots.map(c=>c[0])),maxR=Math.max(...rots.map(c=>c[0]));
  const minC=Math.min(...rots.map(c=>c[1])),maxC=Math.max(...rots.map(c=>c[1]));
  const ms=18,offR=(ch/ms-(maxR-minR+1))/2,offC=(cw/ms-(maxC-minC+1))/2;
  for(const [dr,dc] of rots){
    const px=(dc-minC+offC)*ms,py=(dr-minR+offR)*ms;
    c2d.fillStyle=col+'28';c2d.fillRect(px+1,py+1,ms-2,ms-2);
    c2d.strokeStyle=col;c2d.lineWidth=1.5;c2d.shadowColor=col;c2d.shadowBlur=5;
    c2d.strokeRect(px+1,py+1,ms-2,ms-2);c2d.shadowBlur=0;
  }
}

function draw(){
  // Main board
  ctx.fillStyle='#05050f';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,255,242,.06)';ctx.lineWidth=1;
  for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*SZ,0);ctx.lineTo(c*SZ,H);ctx.stroke();}
  for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*SZ);ctx.lineTo(W,r*SZ);ctx.stroke();}

  // Placed blocks
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(board[r][c])drawCell(ctx,board[r][c],r,c);

  // Ghost & current piece
  if(cur){
    const gr=ghostR();
    const cs=cells(cur.key,cur.rot);
    for(const [dr,dc] of cs)drawCell(ctx,PIECES[cur.key].color,gr+dr,cur.c+dc,.15);
    for(const [dr,dc] of cs)drawCell(ctx,PIECES[cur.key].color,cur.r+dr,cur.c+dc);
  }

  // Particles
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life*1.8);ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);
  }ctx.globalAlpha=1;

  // Mini previews
  drawMini(hCtx,holdKey,hCv.width,hCv.height);
  nCtx.fillStyle='#03030c';nCtx.fillRect(0,0,nCv.width,nCv.height);
  for(let i=0;i<Math.min(3,bag.length);i++){
    nCtx.save();nCtx.translate(0,i*70);drawMini(nCtx,bag[i],nCv.width,70);nCtx.restore();
  }
}

let last=0;
function loop(ts){
  if(!last)last=ts;const dt=Math.min((ts-last)/1000,.05);last=ts;
  if(running)update(dt);
  draw();requestAnimationFrame(loop);
}

document.getElementById('startBtn').onclick=()=>{overlay.style.display='none';startGame();};
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
