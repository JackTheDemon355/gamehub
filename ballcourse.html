tton><div id="lpe" style="color:#ff003c;font-size:12px;min-height:18px;"></div>';var i=document.getElementById('lpi'),b=document.getElementById('lpb'),e=document.getElementById('lpe');i.focus();function go(){if(P.map(p=>p.toLowerCase()).indexOf((i.value||'').trim().toLowerCase())>=0){el.remove();document.body.style.overflow='';}else{e.textContent='Incorrect';i.value='';i.focus();setTimeout(()=>e.textContent='',2200);}}b.addEventListener('click',go);i.addEventListener('keydown',ev=>{if(ev.key==='Enter')go();});}chk();})();

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height,T=40;

// Mobile detect
const isMobile=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isMobile)document.getElementById('mobileCtrl').classList.add('show');
function bindMC(id,key){const el=document.getElementById(id);if(!el)return;el.addEventListener('touchstart',e=>{e.preventDefault();keys[key]=true;},{passive:false});el.addEventListener('touchend',e=>{e.preventDefault();keys[key]=false;},{passive:false});}
bindMC('mcLeft','arrowleft');bindMC('mcRight','arrowright');bindMC('mcUp','jump');bindMC('mcJump','jump');

const COIN_PTS=50;
let level=0,deaths=0,running=false,paused=false;
let grid=[],spikes=[],coins=[],springs=[],exitPos={x:0,y:0},spawn={x:0,y:0};
let particles=[],levelTime=0,levelStart=0;
let bests=[];try{bests=JSON.parse(localStorage.getItem('bc_bests')||'[]');}catch(e){}

const ball={x:0,y:0,r:14,vx:0,vy:0,onGround:false,jumps:0,_jHeld:false};
const GRAV=1100,MAXFALL=700,ACC=1600,FRIC=1400,MAXSPD=320,JUMP=-620,WALLJUMP=-500;

const keys={};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();keys[k]=true;
  if(['arrowleft','arrowright','arrowup',' '].includes(e.key.toLowerCase()))e.preventDefault();
  if(e.key===' '||e.key==='ArrowUp'||k==='w')keys['jump']=true;
  if(k==='r'&&running)loadLevel(level,true);
  if(k==='p'&&running)paused=!paused;
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();keys[k]=false;
  if(e.key===' '||e.key==='ArrowUp'||k==='w')keys['jump']=false;
});

function solidAt(px,py){
  const cN=Math.floor(px/T),r=Math.floor(py/T);
  if(r<0||r>=grid.length||cN<0||(grid[r]&&cN>=grid[r].length))return 0;
  return grid[r]?.[cN]||0;
}

function loadLevel(i,isRetry){
  level=i;
  const rows=LEVELS[i];
  grid=[];spikes=[];coins=[];springs=[];particles=[];
  for(let r=0;r<rows.length;r++){
    grid[r]=[];
    for(let c=0;c<rows[r].length;c++){
      const ch=rows[r][c];const px=c*T,py=r*T;
      grid[r][c]=(ch==='#')?1:0;
      if(ch==='^')spikes.push({x:px+T/2,y:py+T/2});
      if(ch==='*')coins.push({x:px+T/2,y:py+T/2,got:false,t:Math.random()*6});
      if(ch==='S')springs.push({x:px+T/2,y:py+T/2,t:0});
      if(ch==='P'){spawn={x:px+T/2,y:py+T/2};}
      if(ch==='E'){exitPos={x:px+T/2,y:py+T/2};}
    }
  }
  ball.x=spawn.x;ball.y=spawn.y;ball.vx=0;ball.vy=0;ball.onGround=false;ball.jumps=0;ball._jHeld=false;
  levelStart=performance.now();levelTime=0;
  document.getElementById('lvEl').textContent=level+1;
  if(!isRetry){
    const b=document.getElementById('levelBanner');
    b.textContent='LEVEL '+(level+1);b.style.opacity='1';
    setTimeout(()=>b.style.opacity='0',1100);
  }
  updateBest();
}

function updateBest(){
  const b=bests[level];
  document.getElementById('bsEl').textContent=b?b.toFixed(2)+'s':'—';
}

function pop(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=60+Math.random()*140;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-80,life:.5,color:col,sz:3+Math.random()*3});}}

function update(dt){
  levelTime=(performance.now()-levelStart)/1000;
  document.getElementById('tmEl').textContent=levelTime.toFixed(2);

  let dir=0;
  if(keys['arrowleft']||keys['a'])dir-=1;
  if(keys['arrowright']||keys['d'])dir+=1;
  if(dir)ball.vx+=dir*ACC*dt;
  else{if(ball.vx>0)ball.vx=Math.max(0,ball.vx-FRIC*dt);else if(ball.vx<0)ball.vx=Math.min(0,ball.vx+FRIC*dt);}
  ball.vx=Math.max(-MAXSPD,Math.min(MAXSPD,ball.vx));

  ball.vy+=GRAV*dt;ball.vy=Math.min(MAXFALL,ball.vy);

  if(keys['jump']&&!ball._jHeld){
    ball._jHeld=true;
    if(ball.jumps<2){ball.vy=JUMP;ball.jumps++;}
  }
  if(!keys['jump']){ball._jHeld=false;if(ball.vy<-180)ball.vy=-180;}

  ball.x+=ball.vx*dt;
  const hw=ball.r;
  for(const oy of[-hw*.6,0,hw*.6]){
    if(solidAt(ball.x+hw,ball.y+oy)===1){ball.x=Math.floor((ball.x+hw)/T)*T-hw-.01;ball.vx=0;}
    if(solidAt(ball.x-hw,ball.y+oy)===1){ball.x=Math.floor((ball.x-hw)/T)*T+T+hw+.01;ball.vx=0;}
  }
  const prevBot=ball.y+hw;
  ball.y+=ball.vy*dt;ball.onGround=false;
  for(const ox of[-hw*.7,0,hw*.7]){
    if(ball.vy>=0){
      if(solidAt(ball.x+ox,ball.y+hw)===1){ball.y=Math.floor((ball.y+hw)/T)*T-hw-.01;ball.vy=0;ball.onGround=true;ball.jumps=0;}
    }else{if(solidAt(ball.x+ox,ball.y-hw)===1){ball.y=Math.floor((ball.y-hw)/T)*T+T+hw+.01;ball.vy=0;}}
  }

  // Spikes
  for(const s of spikes){if(Math.hypot(s.x-ball.x,s.y-ball.y)<ball.r+10){killBall();return;}}
  // Out of bounds
  if(ball.y>H+80){killBall();return;}

  // Coins
  for(const c of coins){if(!c.got&&Math.hypot(c.x-ball.x,c.y-ball.y)<ball.r+14){c.got=true;pop(c.x,c.y,'#ffe600',8);}}

  // Springs
  for(const s of springs){s.t+=dt;if(Math.hypot(s.x-ball.x,s.y-ball.y)<ball.r+16){ball.vy=-900;s.t=0;}}

  // Exit
  if(Math.hypot(exitPos.x-ball.x,exitPos.y-ball.y)<ball.r+20){
    // Save best
    if(!bests[level]||levelTime<bests[level]){bests[level]=levelTime;try{localStorage.setItem('bc_bests',JSON.stringify(bests));}catch(e){}}
    pop(ball.x,ball.y,'#00fff2',20);
    if(level+1>=LEVELS.length){gameWin();return;}
    loadLevel(level+1);return;
  }

  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.life-=dt;}
  particles=particles.filter(p=>p.life>0);
}

function killBall(){
  deaths++;document.getElementById('dtEl').textContent=deaths;
  pop(ball.x,ball.y,'#ff003c',16);
  setTimeout(()=>loadLevel(level,true),400);
}

function gameWin(){
  running=false;
  const ov=document.getElementById('ov');ov.style.display='flex';
  ov.innerHTML='<h1 style="color:var(--yellow)">COMPLETE!</h1>'
    +'<h2>All 15 Levels Cleared!</h2>'
    +'<p style="color:var(--sub)">Deaths: '+deaths+'</p>'
    +'<button class="bbtn y" id="rb" style="margin-top:14px">↻ PLAY AGAIN</button>'
    +'<p style="margin-top:10px"><a href="index.html" style="color:var(--cyan);font-size:11px">◄ GAME HUB</a></p>';
  document.getElementById('rb').onclick=()=>{ov.style.display='none';deaths=0;document.getElementById('dtEl').textContent=0;running=true;loadLevel(0);};
}

function draw(){
  ctx.fillStyle='#03030c';ctx.fillRect(0,0,W,H);
  // Grid lines
  ctx.strokeStyle='rgba(0,255,242,.04)';ctx.lineWidth=1;
  for(let i=0;i<W;i+=T){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
  for(let j=0;j<H;j+=T){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(W,j);ctx.stroke();}

  // Tiles
  for(let r=0;r<grid.length;r++)for(let c=0;c<(grid[r]||[]).length;c++){
    if(!grid[r][c])continue;
    const px=c*T,py=r*T;
    ctx.fillStyle='#0a2a14';ctx.fillRect(px,py,T,T);
    ctx.strokeStyle='#39ff14';ctx.lineWidth=1.5;ctx.shadowColor='#39ff14';ctx.shadowBlur=6;
    ctx.strokeRect(px+1,py+1,T-2,T-2);ctx.shadowBlur=0;
  }
  // Spikes
  ctx.fillStyle='#ff003c';ctx.shadowColor='#ff003c';ctx.shadowBlur=8;
  for(const s of spikes){ctx.beginPath();ctx.moveTo(s.x-10,s.y+10);ctx.lineTo(s.x,s.y-12);ctx.lineTo(s.x+10,s.y+10);ctx.closePath();ctx.fill();}
  ctx.shadowBlur=0;
  // Springs
  for(const s of springs){
    ctx.fillStyle='#ffe600';ctx.shadowColor='#ffe600';ctx.shadowBlur=10;
    ctx.fillRect(s.x-10,s.y-4,20,8);ctx.fillRect(s.x-6,s.y-12,12,10);ctx.shadowBlur=0;
  }
  // Coins
  for(const c of coins){if(c.got)continue;c.t+=.016;
    const bob=Math.sin(c.t*3)*3;
    ctx.fillStyle='#ffe600';ctx.shadowColor='#ffe600';ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(c.x,c.y+bob,7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }
  // Exit
  const et=performance.now()/400;
  ctx.save();ctx.translate(exitPos.x,exitPos.y);ctx.shadowColor='#39ff14';ctx.shadowBlur=20;
  for(let i=3;i>0;i--){ctx.strokeStyle='rgba(57,255,20,'+(i*.25+.2)+')';ctx.lineWidth=2+i;ctx.beginPath();ctx.ellipse(0,0,12+i*5+Math.sin(et+i)*2,20+i*3,0,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle='rgba(57,255,20,.3)';ctx.beginPath();ctx.ellipse(0,0,10,18,0,0,Math.PI*2);ctx.fill();
  ctx.restore();ctx.shadowBlur=0;

  // Particles
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);}ctx.globalAlpha=1;

  // Ball
  if(running){
    ctx.save();ctx.translate(ball.x,ball.y);
    ctx.shadowColor='#00fff2';ctx.shadowBlur=18;
    const bg=ctx.createRadialGradient(-ball.r*.3,-ball.r*.3,0,0,0,ball.r);
    bg.addColorStop(0,'#a0fffc');bg.addColorStop(.6,'#00fff2');bg.addColorStop(1,'#006066');
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,ball.r,0,Math.PI*2);ctx.fill();
    // Shine
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(-ball.r*.3,-ball.r*.35,ball.r*.3,ball.r*.2,-0.5,0,Math.PI*2);ctx.fill();
    ctx.restore();ctx.shadowBlur=0;
  }

  if(paused&&running){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#00fff2';ctx.font='bold 22px monospace';ctx.textAlign='center';ctx.fillText('PAUSED — P to resume · R restart',W/2,H/2);}
}

let last=0;
function loop(ts){if(!last)last=ts;const dt=Math.min((ts-last)/1000,.033);last=ts;if(running&&!paused)update(dt);draw();requestAnimationFrame(loop);}
document.getElementById('startBtn').onclick=()=>{document.getElementById('ov').style.display='none';deaths=0;running=true;loadLevel(0);};
loadLevel(0,true);requestAnimationFrame(loop);
</script>
</body>
</html>
