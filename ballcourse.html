<title>BALL COURSE — GAME HUB</title>
<style>
:root{--bg:#03030c;--cyan:#00fff2;--yellow:#ffe600;--green:#39ff14;--red:#ff003c;--mag:#ff2fd0;--orange:#ff6a00;--sub:#b9c4cc;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);font-family:'Consolas','Courier New',monospace;overflow:hidden;user-select:none;color:#fff;}
#wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
canvas{display:block;border:2px solid rgba(0,255,242,.2);box-shadow:0 0 40px rgba(0,255,242,.08);cursor:crosshair;}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px 18px;font-size:12px;letter-spacing:2px;pointer-events:none;background:linear-gradient(rgba(0,0,0,.7),transparent);}
.lbl{color:var(--mag);}.val{color:var(--yellow);font-weight:bold;}
#shotBar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:2px;color:var(--sub);}
#shotDots{display:flex;gap:4px;}
.sdot{width:14px;height:14px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);transition:background .2s,box-shadow .2s;}
.sdot.used{background:#222;box-shadow:none;}
#back{position:absolute;bottom:40px;left:14px;z-index:5;color:var(--cyan);text-decoration:none;border:1px solid var(--cyan);padding:6px 12px;font-size:11px;letter-spacing:2px;border-radius:4px;background:rgba(0,0,0,.6);}
#back:hover{background:var(--cyan);color:#000;}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(2,2,10,.95);z-index:10;padding:20px;gap:8px;}
#ov h1{font-size:clamp(26px,6vw,52px);letter-spacing:8px;color:var(--cyan);text-shadow:0 0 14px var(--cyan),0 0 40px rgba(0,255,242,.4);margin-bottom:4px;}
.bbtn{cursor:pointer;background:transparent;border:2px solid var(--cyan);color:var(--cyan);padding:10px 24px;font-family:inherit;font-size:13px;letter-spacing:3px;border-radius:4px;margin:4px;}
.bbtn:hover{background:var(--cyan);color:#000;}
.bbtn.y{border-color:var(--yellow);color:var(--yellow);}.bbtn.y:hover{background:var(--yellow);color:#000;}
/* Power meter */
#powerMeter{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:180px;height:10px;background:#111;border:1px solid rgba(0,255,242,.2);border-radius:5px;overflow:hidden;}
#powerFill{height:100%;width:0%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));transition:none;}
#powerLabel{position:absolute;bottom:74px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:3px;color:var(--sub);}
/* Mobile controls */
#ghDpad{position:fixed;inset:0;pointer-events:none;z-index:200;display:none;}
.gh-d{position:absolute;pointer-events:auto;width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(255,255,255,.8);-webkit-tap-highlight-color:transparent;user-select:none;}
.gh-d:active{background:rgba(0,255,242,.2);}
#ghD-left{bottom:28px;left:14px;}#ghD-right{bottom:28px;left:84px;}
#ghD-up{bottom:98px;left:49px;}#ghD-down{bottom:28px;left:49px;}
#ghD-a1{bottom:28px;right:14px;background:rgba(255,47,208,.18);border-color:rgba(255,47,208,.5);font-size:22px;width:62px;height:62px;}
#ghSettingsBtn{position:fixed;top:10px;right:10px;z-index:201;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;}
#ghSettingsPanel{position:fixed;top:50px;right:10px;z-index:202;background:rgba(5,5,20,.97);border:1px solid rgba(0,255,242,.2);border-radius:10px;padding:14px 16px;width:200px;font-family:Consolas,monospace;display:none;}
#ghSettingsPanel h3{font-size:11px;letter-spacing:4px;color:#00fff2;margin-bottom:10px;}
#ghSettingsPanel .gsr{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:10px;letter-spacing:2px;color:#b9c4cc;}
#ghSettingsPanel .pill{width:36px;height:20px;border-radius:10px;background:#222;position:relative;cursor:pointer;transition:background .2s;}
#ghSettingsPanel .pill.on{background:#00fff2;}
#ghSettingsPanel .pill::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;}
#ghSettingsPanel .pill.on::after{left:18px;}
#ghSettingsPanel .done-btn{width:100%;margin-top:10px;padding:7px;background:transparent;border:1px solid #00fff2;color:#00fff2;font-family:Consolas,monospace;font-size:11px;letter-spacing:2px;border-radius:4px;cursor:pointer;}
</style>

// 15 - Final
{par:5,tee:{x:120,y:H*0.8},hole:{x:W-120,y:H*0.2},
 walls:[{x1:M,y1:M,x2:W2,y2:M},{x1:M,y1:H2,x2:W2,y2:H2},{x1:M,y1:M,x2:M,y2:H2},{x1:W2,y1:M,x2:W2,y2:H2},
        {x1:W*0.4,y1:M,x2:W*0.4,y2:H*0.35},{x1:W*0.6,y1:H*0.65,x2:W*0.6,y2:H2}],
 coins:[{x:W*0.2,y:H*0.4},{x:W*0.5,y:H*0.5},{x:W*0.8,y:H*0.6},{x:W*0.3,y:H*0.7},{x:W*0.7,y:H*0.3}],
 obstacles:[{type:'circle',x:W*0.3,y:H*0.4,r:20},{type:'circle',x:W*0.5,y:H*0.3,r:20},{type:'circle',x:W*0.7,y:H*0.6,r:20}]},
];
}

const HOLES=makeHoles();
let hole=0,shots=0,totalShots=0,par=0,coins=[];
let ball={x:0,y:0,vx:0,vy:0,moving:false},particles=[];
let mouseX=W/2,mouseY=H/2,holding=false,holdStart=0,power=0;
let hi=null;try{hi=JSON.parse(localStorage.getItem('bc_hi'));}catch(e){}
let running=false;
const MAX_SHOTS_PER_HOLE=8;

function updateHiDisplay(){document.getElementById('hiEl').textContent=hi?hi+'str':'—';}
updateHiDisplay();

cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouseX=e.clientX-r.left;mouseY=e.clientY-r.top;});
cv.addEventListener('mousedown',e=>{if(running&&!ball.moving){holding=true;holdStart=Date.now();e.preventDefault();}});
cv.addEventListener('mouseup',e=>{if(holding&&running){shoot();holding=false;}});
cv.addEventListener('touchmove',e=>{e.preventDefault();const r=cv.getBoundingClientRect();mouseX=e.touches[0].clientX-r.left;mouseY=e.touches[0].clientY-r.top;},{passive:false});
cv.addEventListener('touchstart',e=>{e.preventDefault();if(running&&!ball.moving){holding=true;holdStart=Date.now();}},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();if(holding&&running){shoot();holding=false;}},{passive:false});

// Mobile dpad aims the shot direction
let aimDir={x:0,y:0};
function bindDpad(id,dx,dy){
  var el=document.getElementById(id);if(!el)return;
  el.addEventListener('touchstart',e=>{e.preventDefault();aimDir={x:dx,y:dy};if(dy===0&&dx===0&&running&&!ball.moving){holding=true;holdStart=Date.now();}},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();if((id==='ghD-a1')&&holding&&running){shoot();holding=false;}aimDir={x:0,y:0};},{passive:false});
}
bindDpad('ghD-left',-1,0);bindDpad('ghD-right',1,0);bindDpad('ghD-up',0,-1);bindDpad('ghD-down',0,1);
document.getElementById('ghD-a1').addEventListener('touchstart',e=>{e.preventDefault();holding=true;holdStart=Date.now();},{passive:false});
document.getElementById('ghD-a1').addEventListener('touchend',e=>{e.preventDefault();if(holding&&running){shoot();holding=false;}},{passive:false});
GHMobile.init();

function shoot(){
  const h=HOLES[hole];
  const tx=aimDir.x?ball.x+aimDir.x*200:mouseX;
  const ty=aimDir.y?ball.y+aimDir.y*200:mouseY;
  const ang=Math.atan2(ty-ball.y,tx-ball.x);
  const spd=4+power*14;
  ball.vx=Math.cos(ang)*spd;ball.vy=Math.sin(ang)*spd;
  ball.moving=true;shots++;power=0;aimDir={x:0,y:0};
  document.getElementById('shotEl').textContent=shots;
  updateShotDots();
  if(shots>=MAX_SHOTS_PER_HOLE)setTimeout(()=>nextHole(true),1800);
}

function loadHole(i){
  hole=i;shots=0;power=0;holding=false;coins=[];
  const h=HOLES[i];par=h.par;
  ball={x:h.tee.x,y:h.tee.y,vx:0,vy:0,moving:false};
  // Clone coins
  coins=h.coins.map(c=>({...c,got:false,t:Math.random()*6}));
  document.getElementById('lvEl').textContent=i+1;
  document.getElementById('parEl').textContent=par;
  document.getElementById('shotEl').textContent=0;
  document.getElementById('totalEl').textContent=totalShots;
  updateShotDots();
}

function updateShotDots(){
  const el=document.getElementById('shotDots');el.innerHTML='';
  for(let i=0;i<MAX_SHOTS_PER_HOLE;i++){
    const d=document.createElement('div');d.className='sdot'+(i<shots?' used':'');el.appendChild(d);
  }
}

function pop(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=40+Math.random()*120;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.6,color:col,sz:2+Math.random()*4});}}

function nextHole(overShots){
  totalShots+=shots;
  document.getElementById('totalEl').textContent=totalShots;
  if(hole+1>=HOLES.length){gameEnd();return;}
  setTimeout(()=>loadHole(hole+1),overShots?800:1200);
}

function gameEnd(){
  running=false;
  if(hi===null||totalShots<hi){hi=totalShots;try{localStorage.setItem('bc_hi',totalShots);}catch(e){}}
  const ov=document.getElementById('ov');ov.style.display='flex';
  const diff=totalShots-(HOLES.reduce((s,h)=>s+h.par,0));
  const grade=diff<=-5?'HOLE IN ONE LEGEND 🏆':diff<=0?'UNDER PAR ⭐':diff<=5?'PAR 🏌️':'OVER PAR 😅';
  ov.innerHTML='<h1 style="color:var(--yellow)">COURSE COMPLETE!</h1>'
    +'<h2 style="color:var(--cyan)">'+grade+'</h2>'
    +'<div style="font-size:34px;color:var(--yellow);font-weight:bold;margin:10px 0">'+totalShots+' shots</div>'
    +'<p style="color:var(--sub)">Par: '+(HOLES.reduce((s,h)=>s+h.par,0))+' · Best: '+(hi||totalShots)+' shots</p>'
    +'<button class="bbtn y" id="rb" style="margin-top:12px">↻ PLAY AGAIN</button>'
    +'<p style="margin-top:8px"><a href="index.html" style="color:var(--cyan);font-size:11px">◄ GAME HUB</a></p>';
  document.getElementById('rb').onclick=()=>{ov.style.display='none';totalShots=0;running=true;loadHole(0);};
  updateHiDisplay();
}

function reflect(vel,normal){
  const dot=vel.x*normal.x+vel.y*normal.y;
  return{x:vel.x-2*dot*normal.x,y:vel.y-2*dot*normal.y};
}

function lineCircleCollide(x1,y1,x2,y2,cx,cy,r){
  const dx=x2-x1,dy=y2-y1;const len=Math.hypot(dx,dy);
  const nx=dx/len,ny=dy/len;
  const t=Math.max(0,Math.min(len,(cx-x1)*nx+(cy-y1)*ny));
  const px=x1+t*nx,py=y1+t*ny;
  const dist=Math.hypot(cx-px,cy-py);
  return dist<=r?{px,py,nx:(cx-px)/dist,ny:(cy-py)/dist,dist}:null;
}

function update(dt){
  if(holding&&!ball.moving){power=Math.min(1,power+(dt*1.2));document.getElementById('powerFill').style.width=(power*100)+'%';}

  if(!ball.moving)return;
  ball.x+=ball.vx;ball.y+=ball.vy;
  ball.vx*=FRICTION;ball.vy*=FRICTION;

  const h=HOLES[hole];
  // Wall collisions
  for(const w of h.walls){
    const col=lineCircleCollide(w.x1,w.y1,w.x2,w.y2,ball.x,ball.y,BALL_R);
    if(col){
      ball.x=col.px+col.nx*BALL_R*1.05;ball.y=col.py+col.ny*BALL_R*1.05;
      const r=reflect({x:ball.vx,y:ball.vy},{x:col.nx,y:col.ny});
      ball.vx=r.x*0.75;ball.vy=r.y*0.75;
    }
  }
  // Obstacle collisions
  for(const o of h.obstacles){
    if(o.type==='circle'){
      const dist=Math.hypot(ball.x-o.x,ball.y-o.y);
      const minD=BALL_R+o.r;
      if(dist<minD){
        const nx=(ball.x-o.x)/dist,ny=(ball.y-o.y)/dist;
        ball.x=o.x+nx*minD;ball.y=o.y+ny*minD;
        const r=reflect({x:ball.vx,y:ball.vy},{x:nx,y:ny});
        ball.vx=r.x*0.78;ball.vy=r.y*0.78;
        pop(ball.x,ball.y,'#ff6a00',5);
      }
    }
  }
  // Coins
  for(const c of coins){c.t+=dt*3;if(c.got)continue;
    if(Math.hypot(ball.x-c.x,ball.y-c.y)<BALL_R+8){c.got=true;pop(c.x,c.y,'#ffe600',8);}
  }
  // Hole (goal)
  const hx=h.hole.x,hy=h.hole.y;
  if(Math.hypot(ball.x-hx,ball.y-hy)<18){
    ball.vx=0;ball.vy=0;ball.moving=false;
    pop(hx,hy,'#00fff2',20);
    setTimeout(()=>nextHole(false),900);
  }
  // Stop if very slow
  const spd=Math.hypot(ball.vx,ball.vy);
  if(spd<MIN_SPEED){ball.vx=0;ball.vy=0;ball.moving=false;}

  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.93;p.vy*=.93;p.life-=dt;}
  particles=particles.filter(p=>p.life>0);
}

function draw(){
  ctx.fillStyle='#03030c';ctx.fillRect(0,0,W,H);
  // Grid
  ctx.strokeStyle='rgba(0,255,242,.03)';ctx.lineWidth=1;
  for(let i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
  for(let j=0;j<H;j+=40){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(W,j);ctx.stroke();}

  const h=HOLES[hole];
  // Walls
  ctx.strokeStyle='#00fff2';ctx.lineWidth=4;ctx.shadowColor='#00fff2';ctx.shadowBlur=8;
  for(const w of h.walls){ctx.beginPath();ctx.moveTo(w.x1,w.y1);ctx.lineTo(w.x2,w.y2);ctx.stroke();}
  ctx.shadowBlur=0;

  // Obstacles
  for(const o of h.obstacles){
    if(o.type==='circle'){
      ctx.fillStyle='rgba(255,106,0,.2)';ctx.strokeStyle='#ff6a00';ctx.lineWidth=3;
      ctx.shadowColor='#ff6a00';ctx.shadowBlur=12;
      ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.shadowBlur=0;
    }
  }

  // Coins
  for(const c of coins){if(c.got)continue;const bob=Math.sin(c.t)*3;
    ctx.fillStyle='#ffe600';ctx.shadowColor='#ffe600';ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(c.x,c.y+bob,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.arc(c.x-2,c.y+bob-2,3,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }

  // Hole (goal) — flag
  const hx=h.hole.x,hy=h.hole.y;
  ctx.fillStyle='rgba(57,255,20,.15)';ctx.strokeStyle='#39ff14';ctx.lineWidth=2;
  ctx.shadowColor='#39ff14';ctx.shadowBlur=14;
  ctx.beginPath();ctx.arc(hx,hy,18,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(hx,hy-18);ctx.lineTo(hx,hy-32);ctx.stroke();
  ctx.fillStyle='#ff003c';ctx.shadowColor='#ff003c';ctx.shadowBlur=6;
  ctx.beginPath();ctx.moveTo(hx,hy-32);ctx.lineTo(hx+14,hy-26);ctx.lineTo(hx,hy-20);ctx.fill();
  ctx.shadowBlur=0;

  // Tee
  ctx.fillStyle='rgba(255,255,255,.12)';
  ctx.beginPath();ctx.arc(h.tee.x,h.tee.y,14,0,Math.PI*2);ctx.fill();

  // Aim line
  if(!ball.moving&&running){
    const tx=aimDir.x?ball.x+aimDir.x*200:mouseX;
    const ty=aimDir.y?ball.y+aimDir.y*200:mouseY;
    const ang=Math.atan2(ty-ball.y,tx-ball.x);
    ctx.strokeStyle='rgba(0,255,242,.3)';ctx.lineWidth=1;ctx.setLineDash([6,8]);
    ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+Math.cos(ang)*120,ball.y+Math.sin(ang)*120);ctx.stroke();
    ctx.setLineDash([]);
    // Arrow
    ctx.fillStyle='rgba(0,255,242,.5)';
    const ax=ball.x+Math.cos(ang)*125,ay=ball.y+Math.sin(ang)*125;
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax-Math.cos(ang-0.4)*10,ay-Math.sin(ang-0.4)*10);ctx.lineTo(ax-Math.cos(ang+0.4)*10,ay-Math.sin(ang+0.4)*10);ctx.fill();
  }

  // Ball trail
  if(ball.moving){
    const spd=Math.hypot(ball.vx,ball.vy);
    ctx.globalAlpha=.25;ctx.fillStyle='#00fff2';
    ctx.beginPath();ctx.arc(ball.x-ball.vx*3,ball.y-ball.vy*3,BALL_R*.7,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(ball.x-ball.vx*6,ball.y-ball.vy*6,BALL_R*.4,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }

  // Ball
  if(running){
    const bg=ctx.createRadialGradient(ball.x-BALL_R*.3,ball.y-BALL_R*.3,0,ball.x,ball.y,BALL_R);
    bg.addColorStop(0,'#a0fffc');bg.addColorStop(.7,'#00fff2');bg.addColorStop(1,'#006066');
    ctx.fillStyle=bg;ctx.shadowColor='#00fff2';ctx.shadowBlur=16;
    ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }

  // Particles
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*1.6);ctx.fillStyle=p.color;ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);}ctx.globalAlpha=1;
}

let last=0;
function loop(ts){if(!last)last=ts;const dt=Math.min((ts-last)/1000,.05);last=ts;if(running)update(dt);draw();requestAnimationFrame(loop);}
document.getElementById('startBtn').onclick=()=>{document.getElementById('ov').style.display='none';totalShots=0;running=true;loadHole(0);};
requestAnimationFrame(loop);
</script>
