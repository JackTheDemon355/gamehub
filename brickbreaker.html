<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRICK BREAKER</title>
<style>
  :root{--cyan:#00fff2;--magenta:#ff2fd0;--yellow:#ffe600;--green:#39ff14;--red:#ff003c;--orange:#ff6a00;--bg:#03030c;}
  html,body{margin:0;height:100%;background:var(--bg);font-family:'Consolas','Courier New',monospace;overflow:hidden;-webkit-user-select:none;user-select:none;}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
  canvas{border:2px solid var(--cyan);box-shadow:0 0 40px rgba(0,255,242,.3);display:block;}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:11px 26px;font-size:14px;letter-spacing:2px;pointer-events:none;color:var(--cyan);}
  .lbl{color:var(--magenta);}.val{color:var(--yellow);font-weight:bold;}
  #hud .box{display:flex;gap:14px;align-items:center;}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;background:rgba(2,2,8,.93);z-index:10;padding:20px;}
  #overlay h1{font-size:clamp(30px,6vw,56px);margin:0;color:var(--cyan);letter-spacing:8px;
    text-shadow:0 0 16px var(--cyan),0 0 40px var(--cyan);animation:pulse 1.4s infinite;}
  #overlay h2{font-size:17px;margin:10px 0;color:var(--magenta);}
  #overlay p{color:#9fb0ba;font-size:13px;margin:4px 0;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.7;}}
  .bbtn{cursor:pointer;background:transparent;color:var(--yellow);border:2px solid var(--yellow);
    padding:12px 28px;font-family:inherit;font-size:16px;letter-spacing:3px;margin:6px;border-radius:4px;}
  .bbtn:hover{background:var(--yellow);color:#000;}
  #back{position:absolute;bottom:14px;left:18px;z-index:5;color:var(--cyan);text-decoration:none;
    border:1px solid var(--cyan);padding:7px 14px;font-size:12px;letter-spacing:2px;border-radius:4px;}
  #back:hover{background:var(--cyan);color:#000;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="700" height="620"></canvas>
  <div id="hud">
    <div class="box"><span class="lbl">SCORE</span><span class="val" id="sc">0</span>
      <span class="lbl">HI</span><span class="val" id="hi">0</span></div>
    <div class="box">
      <span class="lbl">LEVEL</span><span class="val" id="lv">1</span>
      <span class="lbl">LIVES</span><span class="val" id="livesEl">3</span>
      <span class="lbl">BALLS</span><span class="val" id="ballc">1</span>
    </div>
  </div>
  <a id="back" href="index.html">◄ HUB</a>
  <div id="overlay">
    <h1>BRICK BREAKER</h1>
    <h2>SMASH THE GRID</h2>
    <p>Mouse / Touch / ← → — move paddle &nbsp;|&nbsp; Click / Tap — launch ball</p>
    <p>Power-ups fall from destroyed bricks. Multi-ball chaos at higher levels!</p>
    <p style="margin-top:8px;font-size:11px;color:#556">
      + Extra life &nbsp;·&nbsp; ↔ Wide paddle &nbsp;·&nbsp; ● Multi-ball &nbsp;·&nbsp; ⚡ Speed &nbsp;·&nbsp; 🔥 Fireball (1-shot)
    </p>
    <button class="bbtn" id="startBtn" style="margin-top:18px">▶ PLAY</button>
  </div>
</div>
<script>
(function(){
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const scEl=document.getElementById('sc'),hiEl=document.getElementById('hi'),
      lvEl=document.getElementById('lv'),livesEl=document.getElementById('livesEl'),
      ballcEl=document.getElementById('ballc'),overlay=document.getElementById('overlay');

let hi=0;try{hi=parseInt(localStorage.getItem('bb_hi')||'0')||0;}catch(e){}hiEl.textContent=hi;

// --- Constants ---
const PAD_W_BASE=100,PAD_H=12,PAD_Y=H-40,BALL_R=7;
const BRICK_COLS=10,BRICK_W=(W-40)/BRICK_COLS,BRICK_H=22,BRICK_TOP=60;
const BASE_SPEED=340;

// HP colour gradient: green → cyan → yellow → orange → magenta → red
const HP_COLS=['#39ff14','#00fff2','#ffe600','#ff6a00','#ff2fd0','#ff003c'];
function brickCol(hp,maxHp){
  const t=maxHp<=1?0:(hp-1)/(maxHp-1);
  const idx=Math.round(t*(HP_COLS.length-1));
  return HP_COLS[Math.min(idx,HP_COLS.length-1)];
}

// --- Game state ---
let score=0,lives=3,level=1,running=false;
let padX=W/2,padW=PAD_W_BASE,padWideTimer=0;
let balls=[],bricks=[],powerups=[],particles=[];
let launched=false,mouseX=W/2;
let levelClearing=false; // debounce level-clear

function ballSpeed(){return BASE_SPEED+level*14;}

function newBall(bx,by,vx,vy,fire){
  const spd=ballSpeed();
  const len=Math.sqrt(vx*vx+vy*vy)||spd;
  return{x:bx,y:by,vx:vx/len*spd,vy:vy/len*spd,fire:!!fire,fireTimer:0,trail:[],alive:true};
}

function buildLevel(lv){
  bricks=[];levelClearing=false;
  const rows=Math.min(4+Math.floor(lv/2),12);
  const maxHp=Math.min(1+Math.floor(lv/3),6);
  for(let r=0;r<rows;r++){
    for(let c=0;c<BRICK_COLS;c++){
      if(Math.random()<(lv>2?.1:0))continue; // sparse gaps
      const hp=maxHp===1?1:Math.max(1,maxHp-Math.floor(Math.random()*(maxHp)));
      bricks.push({
        x:20+c*BRICK_W,y:BRICK_TOP+r*BRICK_H,
        w:BRICK_W-3,h:BRICK_H-3,
        hp,maxHp:hp,alive:true,
        pow:Math.random()<.14?['life','wide','multi','speed','fire'][Math.floor(Math.random()*5)]:null
      });
    }
  }
}

function startLevel(lv){
  level=lv;lvEl.textContent=lv;
  buildLevel(lv);
  padW=PAD_W_BASE;padWideTimer=0;
  balls=[newBall(W/2,PAD_Y-BALL_R-1,0,-1,false)];
  powerups=[];launched=false;
  ballcEl.textContent=1;
}

function pop(px,py,col,n){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=40+Math.random()*130;
    particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.5,color:col,sz:2+Math.random()*3});}
}

// Mouse / touch
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouseX=e.clientX-r.left;});
// Keyboard paddle control
let kLeft=false,kRight=false;
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')kLeft=true;if(e.key==='ArrowRight')kRight=true;if(e.key===' '&&!launched){e.preventDefault();launch();}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')kLeft=false;if(e.key==='ArrowRight')kRight=false;});
cv.addEventListener('click',()=>{if(!launched)launch();});
cv.addEventListener('touchmove',e=>{e.preventDefault();const r=cv.getBoundingClientRect();mouseX=e.touches[0].clientX-r.left;},{passive:false});
cv.addEventListener('touchstart',e=>{e.preventDefault();const r=cv.getBoundingClientRect();mouseX=e.touches[0].clientX-r.left;if(!launched)launch();},{passive:false});

function launch(){
  if(launched||balls.length===0)return;
  launched=true;
  const spd=ballSpeed();
  // random angle between -40deg and 40deg from straight up
  const ang=(Math.random()-.5)*0.7;
  balls[0].vx=Math.sin(ang)*spd;
  balls[0].vy=-Math.cos(ang)*spd;
}

function applyPow(type){
  if(type==='life'){lives=Math.min(9,lives+1);livesEl.textContent=lives;}
  else if(type==='wide'){padW=Math.min(200,PAD_W_BASE*1.75);padWideTimer=9;}
  else if(type==='multi'){
    const src=balls.find(b=>b.alive)||{x:W/2,y:PAD_Y-60,vx:0,vy:-1};
    const spd=ballSpeed();
    for(let i=0;i<2;i++){
      const a=Math.atan2(src.vy,src.vx)+(i===0?.4:-.4);
      balls.push(newBall(src.x,src.y,Math.cos(a)*spd,Math.sin(a)*spd,src.fire));
    }
  }
  else if(type==='speed'){for(const b of balls){if(!b.alive)continue;const spd2=ballSpeed()*1.35;const a=Math.atan2(b.vy,b.vx);b.vx=Math.cos(a)*spd2;b.vy=Math.sin(a)*spd2;}}
  else if(type==='fire'){for(const b of balls){if(b.alive){b.fire=true;b.fireTimer=6;}}}
}

function update(dt){
  // Paddle follow
  padX+=(mouseX-padX)*Math.min(1,dt*20);
  padX=Math.max(padW/2,Math.min(W-padW/2,padX));
  if(padWideTimer>0){padWideTimer-=dt;if(padWideTimer<=0){padW=PAD_W_BASE;padWideTimer=0;}}

  // Keyboard paddle movement
  if(kLeft)mouseX=Math.max(padW/2,mouseX-PAD_SPEED*dt);
  if(kRight)mouseX=Math.min(W-padW/2,mouseX+PAD_SPEED*dt);

  if(!launched){
    if(balls.length>0){balls[0].x=padX;balls[0].y=PAD_Y-BALL_R-1;}
    for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}
    particles=particles.filter(p=>p.life>0);
    return;
  }

  // Update each ball
  for(const b of balls){
    if(!b.alive)continue;
    b.trail.push({x:b.x,y:b.y});if(b.trail.length>9)b.trail.shift();
    if(b.fire&&b.fireTimer>0)b.fireTimer-=dt;
    if(b.fire&&b.fireTimer<=0)b.fire=false;

    b.x+=b.vx*dt;b.y+=b.vy*dt;

    // Walls
    if(b.x-BALL_R<0){b.x=BALL_R;b.vx=Math.abs(b.vx);}
    if(b.x+BALL_R>W){b.x=W-BALL_R;b.vx=-Math.abs(b.vx);}
    if(b.y-BALL_R<0){b.y=BALL_R;b.vy=Math.abs(b.vy);}

    // Paddle
    if(b.vy>0&&b.y+BALL_R>=PAD_Y-PAD_H/2&&b.y-BALL_R<=PAD_Y+PAD_H/2
       &&b.x>=padX-padW/2-BALL_R&&b.x<=padX+padW/2+BALL_R){
      const rel=(b.x-padX)/(padW/2);
      const spd=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
      const ang=rel*0.36*Math.PI;
      b.vx=Math.sin(ang)*spd;b.vy=-Math.abs(Math.cos(ang)*spd);
      b.y=PAD_Y-PAD_H/2-BALL_R-0.5;
      pop(b.x,PAD_Y,'#00fff2',5);
    }

    // Fell out
    if(b.y>H+30){b.alive=false;continue;}

    // Brick collisions
    for(const br of bricks){
      if(!br.alive)continue;
      const closX=Math.max(br.x,Math.min(br.x+br.w,b.x));
      const closY=Math.max(br.y,Math.min(br.y+br.h,b.y));
      const dx=b.x-closX,dy=b.y-closY;
      if(dx*dx+dy*dy<BALL_R*BALL_R){
        const col=brickCol(br.hp,br.maxHp);
        pop(closX,closY,col,5);
        if(b.fire){br.hp=0;}
        else{
          br.hp--;
          // Determine which face was hit for bounce
          const overL=b.x+BALL_R-br.x,overR=br.x+br.w-b.x+BALL_R;
          const overT=b.y+BALL_R-br.y,overB=br.y+br.h-b.y+BALL_R;
          if(Math.min(overL,overR)<Math.min(overT,overB)){b.vx=-b.vx;}
          else{b.vy=-b.vy;}
        }
        if(br.hp<=0){
          br.alive=false;
          const col2=brickCol(br.maxHp,br.maxHp);
          pop(br.x+br.w/2,br.y+br.h/2,col2,14);
          score+=10*br.maxHp*level;scEl.textContent=score;
          if(score>hi){hi=score;hiEl.textContent=hi;try{localStorage.setItem('bb_hi',String(hi));}catch(e){}}
          if(br.pow)powerups.push({x:br.x+br.w/2,y:br.y+br.h/2,vy:130,type:br.pow,alive:true});
        }
        break; // one brick per frame per ball
      }
    }
  }

  // Remove dead bricks
  bricks=bricks.filter(b=>b.alive);

  // Dead ball handling
  const prevCount=balls.filter(b=>b.alive).length;
  balls=balls.filter(b=>b.alive);
  if(prevCount>0&&balls.length===0){
    lives--;livesEl.textContent=lives;
    if(lives<=0){gameOver();return;}
    balls=[newBall(padX,PAD_Y-BALL_R-1,0,-1,false)];launched=false;
  }
  ballcEl.textContent=balls.length;

  // Powerups
  for(const p of powerups){p.y+=p.vy*dt;}
  powerups=powerups.filter(p=>{
    if(p.y>H+20)return false;
    if(p.y+12>=PAD_Y-PAD_H/2&&p.y-12<=PAD_Y+PAD_H/2&&Math.abs(p.x-padX)<padW/2+14){
      applyPow(p.type);return false;
    }
    return true;
  });

  // Particles
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.94;p.vy*=.94;}
  particles=particles.filter(p=>p.life>0);

  // Level clear
  if(!levelClearing&&bricks.length===0){
    levelClearing=true;
    pop(W/2,H/2,'#ffe600',40);
    setTimeout(()=>startLevel(level+1),700);
  }
}

function gameOver(){
  running=false;
  overlay.innerHTML=`<h1 style="color:#ff003c;text-shadow:0 0 16px #ff003c">GAME OVER</h1>
    <h2>Level ${level}</h2><p>Score: ${score} &nbsp;|&nbsp; Hi: ${hi}</p>
    <button class="bbtn" id="rb">↻ RETRY</button>
    <p style="margin-top:10px"><a href="index.html" style="color:var(--cyan)">◄ HUB</a></p>`;
  overlay.style.display='flex';
  document.getElementById('rb').onclick=()=>{overlay.style.display='none';score=0;lives=3;scEl.textContent=0;livesEl.textContent=3;running=true;startLevel(1);};
}

function draw(){
  ctx.fillStyle='#05050f';ctx.fillRect(0,0,W,H);
  // Grid
  ctx.strokeStyle='rgba(0,255,242,.04)';ctx.lineWidth=1;
  for(let i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
  for(let j=0;j<H;j+=40){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(W,j);ctx.stroke();}

  // Bricks
  for(const br of bricks){
    const col=brickCol(br.hp,br.maxHp);
    ctx.fillStyle=col+'1a';ctx.fillRect(br.x,br.y,br.w,br.h);
    ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.shadowColor=col;ctx.shadowBlur=7;
    ctx.strokeRect(br.x+1,br.y+1,br.w-2,br.h-2);ctx.shadowBlur=0;
    if(br.maxHp>1){
      ctx.fillStyle=col;ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(br.hp,br.x+br.w/2,br.y+br.h/2);
    }
    if(br.pow){
      ctx.fillStyle='rgba(255,255,255,.18)';ctx.font='8px monospace';ctx.textAlign='right';ctx.textBaseline='top';
      ctx.fillText('▼',br.x+br.w-3,br.y+2);
    }
  }

  // Powerups
  const pcols={life:'#39ff14',wide:'#00fff2',multi:'#ffe600',speed:'#ff003c',fire:'#ff2fd0'};
  const plab={life:'+',wide:'↔',multi:'●',speed:'⚡',fire:'🔥'};
  for(const p of powerups){
    const col=pcols[p.type]||'#fff';
    ctx.save();ctx.translate(p.x,p.y);ctx.shadowColor=col;ctx.shadowBlur=14;
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#000';ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(plab[p.type]||'?',0,1);ctx.restore();
  }

  // Particles
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);
  }ctx.globalAlpha=1;

  // Balls
  for(const b of balls){
    if(!b.alive)continue;
    // Trail
    for(let i=0;i<b.trail.length;i++){
      const tp=b.trail[i],a=(i/b.trail.length)*0.35;
      ctx.globalAlpha=a;ctx.fillStyle=b.fire?'#ff6a00':'#00fff2';
      ctx.beginPath();ctx.arc(tp.x,tp.y,BALL_R*(i/b.trail.length*.8+.2),0,Math.PI*2);ctx.fill();
    }ctx.globalAlpha=1;
    const col=b.fire?'#ff2fd0':'#00fff2';
    ctx.shadowColor=col;ctx.shadowBlur=16;ctx.fillStyle=col;
    ctx.beginPath();ctx.arc(b.x,b.y,BALL_R,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }

  // Paddle
  ctx.shadowColor=padWideTimer>0?'#ffe600':'#00fff2';ctx.shadowBlur=18;
  ctx.fillStyle=padWideTimer>0?'#ffe600':'#00fff2';
  // Use rect instead of roundRect for browser compat
  ctx.beginPath();ctx.rect(padX-padW/2,PAD_Y-PAD_H/2,padW,PAD_H);ctx.fill();ctx.shadowBlur=0;

  // Launch hint
  if(!launched){
    ctx.fillStyle='rgba(255,255,255,.28)';ctx.font='13px monospace';ctx.textAlign='center';
    ctx.fillText('CLICK OR TAP TO LAUNCH',W/2,PAD_Y-32);
  }
}

let last=0;
function loop(ts){
  if(!last)last=ts;const dt=Math.min((ts-last)/1000,.033);last=ts;
  if(running)update(dt);
  draw();requestAnimationFrame(loop);
}

document.getElementById('startBtn').onclick=()=>{
  overlay.style.display='none';running=true;startLevel(1);
};
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
