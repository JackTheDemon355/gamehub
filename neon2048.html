<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="google-site-verification" content="1rNDahd3JgJCYe4UGAdNJqAAZM_oOawfSZ-I2i2_mPs" />
<link rel="icon" href="favicon.ico" type="image/x-icon">
<title>NEON 2048 — GAME HUB</title>
<style>
:root{--bg:#03030c;--cyan:#00fff2;--yellow:#ffe600;--green:#39ff14;--red:#ff003c;--mag:#ff2fd0;--sub:#b9c4cc;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(--bg);font-family:'Consolas','Courier New',monospace;color:#fff;
  background-image:radial-gradient(ellipse at 30% 0%,#0a0a2e,transparent 55%),radial-gradient(ellipse at 80% 100%,#0a001a,transparent 55%);}
body{display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,255,242,.02) 0,rgba(0,255,242,.02) 1px,transparent 1px,transparent 4px);}
#back{position:fixed;top:12px;left:12px;z-index:50;color:var(--cyan);text-decoration:none;border:1px solid var(--cyan);padding:7px 14px;font-size:11px;letter-spacing:2px;border-radius:4px;background:rgba(0,0,0,.7);}
#back:hover{background:var(--cyan);color:#000;}
header{text-align:center;padding:20px 10px 6px;position:relative;z-index:1;}
header h1{font-size:clamp(24px,6vw,42px);letter-spacing:8px;color:var(--cyan);text-shadow:0 0 12px var(--cyan),0 0 30px rgba(0,255,242,.35);}
header p{font-size:10px;letter-spacing:4px;color:var(--mag);margin-top:4px;}
#top{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;padding:8px 12px;position:relative;z-index:1;}
.box{background:rgba(255,255,255,.04);border:1px solid rgba(0,255,242,.2);border-radius:8px;padding:6px 16px;text-align:center;min-width:92px;}
.box .k{font-size:9px;letter-spacing:3px;color:var(--mag);}.box .v{font-size:20px;font-weight:bold;color:var(--yellow);}
.btn{cursor:pointer;background:transparent;border:1px solid rgba(0,255,242,.3);color:var(--sub);padding:9px 14px;font-family:inherit;font-size:11px;letter-spacing:2px;border-radius:4px;transition:.15s;}
.btn:hover{border-color:var(--cyan);color:var(--cyan);}
.btn.go{border-color:var(--yellow);color:var(--yellow);}.btn.go:hover{background:var(--yellow);color:#000;}
.btn:disabled{opacity:.3;cursor:not-allowed;}
select{background:rgba(0,0,0,.5);border:1px solid rgba(0,255,242,.25);color:var(--cyan);padding:9px 10px;font-family:inherit;font-size:11px;letter-spacing:2px;border-radius:4px;outline:none;cursor:pointer;}
#boardWrap{position:relative;z-index:1;padding:10px 0;}
#board{position:relative;width:var(--bs,340px);height:var(--bs,340px);background:rgba(0,255,242,.04);border:2px solid rgba(0,255,242,.25);border-radius:12px;box-shadow:0 0 30px rgba(0,255,242,.08);touch-action:none;}
.bgcell{position:absolute;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);}
.tile{position:absolute;left:0;top:0;transition:transform .12s ease-out;}
.tile .in{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:bold;border-radius:8px;border:2px solid;}
.tile .in.pop{animation:pop .18s ease-out;}
@keyframes pop{0%{transform:scale(.4);}60%{transform:scale(1.14);}100%{transform:scale(1);}}
#over{position:absolute;inset:0;border-radius:12px;background:rgba(3,3,15,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;z-index:5;}
#over h2{font-size:clamp(22px,6vw,34px);letter-spacing:6px;}
#help{font-size:10px;letter-spacing:1px;color:#556;text-align:center;max-width:420px;line-height:1.9;padding:4px 14px 30px;position:relative;z-index:1;}
</style>
</head>
<body>
<a id="back" href="index.html">◄ HUB</a>
<header><h1>NEON 2048</h1><p>◄ MERGE THE TILES ►</p></header>

<div id="top">
  <div class="box"><div class="k">SCORE</div><div class="v" id="scoreEl">0</div></div>
  <div class="box"><div class="k">BEST</div><div class="v" id="bestEl">0</div></div>
  <select id="sizeSel" title="Board size">
    <option value="3">3×3</option><option value="4" selected>4×4</option><option value="5">5×5</option><option value="6">6×6</option>
  </select>
  <button class="btn" id="undoBtn">↶ UNDO</button>
  <button class="btn go" id="newBtn">↻ NEW</button>
</div>

<div id="boardWrap">
  <div id="board">
    <div id="over"><h2 id="overTitle"></h2><div id="overSub" style="font-size:13px;color:var(--sub);letter-spacing:2px"></div>
      <div style="display:flex;gap:8px"><button class="btn" id="keepBtn" style="display:none">KEEP GOING</button><button class="btn go" id="againBtn">↻ NEW GAME</button></div></div>
  </div>
</div>
<div id="help">Arrow keys / WASD or swipe to slide tiles. Equal tiles merge. Reach the target tile to win. U = undo, N = new game.</div>

<script>
(function(){var P=['gamehub234','oscarmccumstie','user13579'];function isSH(){var n=new Date(),a=new Date(n.getTime()+28800000),d=a.getUTCDay();if(!d||d===6)return false;var m=a.getUTCHours()*60+a.getUTCMinutes();return m>=495&&m<915;}function chk(){fetch('lock.json?nc='+Date.now()).then(r=>r.json()).then(d=>{if(d.locked===true||d.school_hours_lock===true&&isSH())showL(d.message||'Locked.');}).catch(()=>{});}function showL(msg){var el=document.createElement('div');el.style.cssText='position:fixed;inset:0;background:#03030c;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Consolas,monospace;color:#00fff2;text-align:center;gap:14px;padding:24px;';el.innerHTML='<div style="font-size:40px;color:#ff003c;letter-spacing:6px;font-weight:bold">LOCKED 🔒</div><div style="font-size:13px;color:#888;max-width:460px;line-height:1.7">'+msg+'</div><div style="font-size:11px;color:#334">Hold SHIFT + key · tap 3×</div>';document.body.appendChild(el);document.body.style.overflow='hidden';var sh=false;document.addEventListener('keydown',function kd(e){if(e.key==='Shift'){sh=true;return;}if(sh){document.removeEventListener('keydown',kd);pw(el);}});var t=0,tc=0;el.addEventListener('click',function(){var n=Date.now();if(n-t>700)tc=0;t=n;if(++tc>=3){tc=0;pw(el);}});}function pw(el){el.innerHTML='<div style="font-size:30px;color:#ffe600;letter-spacing:6px;font-weight:bold">PASSWORD 🔑</div><input id="lpi" type="password" autocomplete="off" style="background:rgba(0,0,0,.65);border:2px solid rgba(0,255,242,.4);color:#fff;padding:13px 20px;font-family:Consolas,monospace;font-size:20px;letter-spacing:6px;border-radius:6px;outline:none;width:280px;text-align:center;" placeholder="••••••••"><button id="lpb" style="background:transparent;color:#00fff2;border:2px solid #00fff2;padding:11px 28px;font-family:Consolas,monospace;font-size:14px;letter-spacing:3px;border-radius:4px;cursor:pointer;margin-top:4px;">▶ UNLOCK</button><div id="lpe" style="color:#ff003c;font-size:12px;min-height:18px;"></div>';var i=document.getElementById('lpi'),b=document.getElementById('lpb'),e=document.getElementById('lpe');i.focus();function go(){if(P.map(p=>p.toLowerCase()).indexOf((i.value||'').trim().toLowerCase())>=0){el.remove();document.body.style.overflow='';}else{e.textContent='Incorrect';i.value='';i.focus();setTimeout(()=>e.textContent='',2200);}}b.addEventListener('click',go);i.addEventListener('keydown',ev=>{if(ev.key==='Enter')go();});}chk();})();

const DIRS=[[-1,0],[0,1],[1,0],[0,-1]];
const TARGET={3:256,4:2048,5:4096,6:8192};
let N=4,tiles=[],nextId=1,score=0,best=0,prev=null,over=false,won=false,keepGoing=false,locked=false,cell=80,gap=10;
const board=document.getElementById('board');

function bestKey(){return 'n2048_best_'+N;}
function layout(){
  const bs=Math.floor(Math.min(window.innerWidth-28,window.innerHeight-300,460));
  const size=Math.max(bs,240);
  board.style.setProperty('--bs',size+'px');
  gap=Math.max(6,Math.round(size*.025));
  cell=(size-4-gap*(N+1))/N;
}
function buildBg(){
  board.querySelectorAll('.bgcell').forEach(e=>e.remove());
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const d=document.createElement('div');d.className='bgcell';
    d.style.width=d.style.height=cell+'px';
    d.style.left=(gap+c*(cell+gap))+'px';d.style.top=(gap+r*(cell+gap))+'px';
    board.insertBefore(d,board.firstChild);
  }
}
function place(t){
  t.el.style.width=t.el.style.height=cell+'px';
  t.el.style.transform='translate('+(gap+t.c*(cell+gap))+'px,'+(gap+t.r*(cell+gap))+'px)';
}
function styleTile(t){
  const k=Math.log2(t.v),h=(k*34+170)%360,len=String(t.v).length;
  t.inn.textContent=t.v;
  t.inn.style.background='hsla('+h+',85%,40%,.28)';
  t.inn.style.borderColor='hsl('+h+',100%,60%)';
  t.inn.style.color='hsl('+h+',100%,78%)';
  t.inn.style.boxShadow='0 0 '+Math.min(24,k*2)+'px hsla('+h+',100%,55%,.45)';
  t.inn.style.fontSize=(cell*(len>=4?.30:len===3?.36:.44))+'px';
}
function addTile(v,r,c,isNew){
  const el=document.createElement('div');el.className='tile';
  const inn=document.createElement('div');inn.className='in'+(isNew?' pop':'');
  el.appendChild(inn);board.appendChild(el);
  const t={id:nextId++,v,r,c,el,inn,dead:false,into:null};
  tiles.push(t);styleTile(t);place(t);return t;
}
function clearTiles(){tiles.forEach(t=>t.el.remove());tiles=[];}
function cellMap(){const m=Array.from({length:N},()=>Array(N).fill(null));tiles.forEach(t=>{if(!t.dead)m[t.r][t.c]=t;});return m;}
function spawn(){
  const m=cellMap(),empty=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!m[r][c])empty.push([r,c]);
  if(!empty.length)return;
  const [r,c]=empty[Math.floor(Math.random()*empty.length)];
  addTile(Math.random()<.9?2:4,r,c,true);
}
function hud(){
  document.getElementById('scoreEl').textContent=score;
  document.getElementById('bestEl').textContent=best;
  document.getElementById('undoBtn').disabled=!prev;
}

function newGame(){
  N=parseInt(document.getElementById('sizeSel').value)||4;
  clearTiles();layout();buildBg();
  try{best=parseInt(localStorage.getItem(bestKey()))||0;}catch(e){best=0;}
  score=0;prev=null;over=false;won=false;keepGoing=false;locked=false;
  document.getElementById('over').style.display='none';
  spawn();spawn();hud();
}

function canMove(){
  const m=cellMap();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(!m[r][c])return true;
    if(c+1<N&&m[r][c+1]&&m[r][c+1].v===m[r][c].v)return true;
    if(r+1<N&&m[r+1][c]&&m[r+1][c].v===m[r][c].v)return true;
  }
  return false;
}

function move(d){
  if(over||locked)return;
  const snap={tiles:tiles.filter(t=>!t.dead).map(t=>({v:t.v,r:t.r,c:t.c})),score};
  const m=cellMap();let moved=false,gain=0;
  const survivors=[];
  for(let line=0;line<N;line++){
    const list=[];
    for(let k=0;k<N;k++){
      let r,c;
      if(d===0){r=k;c=line;}else if(d===2){r=N-1-k;c=line;}else if(d===3){r=line;c=k;}else{r=line;c=N-1-k;}
      if(m[r][c])list.push(m[r][c]);
    }
    const out=[];
    list.forEach(t=>{
      const last=out[out.length-1];
      if(last&&!last.merged&&last.t.v===t.v){last.merged=true;last.t.v*=2;gain+=last.t.v;t.dead=true;t.into=last.t;survivors.push(last.t);}
      else out.push({t,merged:false});
    });
    out.forEach((o,idx)=>{
      let r,c;
      if(d===0){r=idx;c=line;}else if(d===2){r=N-1-idx;c=line;}else if(d===3){r=line;c=idx;}else{r=line;c=N-1-idx;}
      if(o.t.r!==r||o.t.c!==c)moved=true;
      o.t.r=r;o.t.c=c;
    });
    list.forEach(t=>{if(t.dead){t.r=t.into.r;t.c=t.into.c;moved=true;}});
  }
  if(!moved)return;
  prev=snap;score+=gain;
  if(score>best){best=score;try{localStorage.setItem(bestKey(),String(best));}catch(e){}}
  tiles.forEach(place);
  locked=true;
  setTimeout(()=>{
    tiles.filter(t=>t.dead).forEach(t=>t.el.remove());
    tiles=tiles.filter(t=>!t.dead);
    survivors.forEach(t=>{styleTile(t);t.inn.classList.remove('pop');void t.inn.offsetWidth;t.inn.classList.add('pop');});
    spawn();hud();locked=false;
    const top=Math.max(...tiles.map(t=>t.v));
    if(!won&&!keepGoing&&top>=TARGET[N]){won=true;showOver('YOU WIN! 🎉','Reached '+top,true);}
    else if(!canMove()){over=true;showOver('GAME OVER','Score '+score,false);}
  },125);
  hud();
}

function showOver(title,sub,canKeep){
  const o=document.getElementById('over');
  document.getElementById('overTitle').textContent=title;
  document.getElementById('overTitle').style.color=canKeep?'var(--yellow)':'var(--red)';
  document.getElementById('overSub').textContent=sub;
  document.getElementById('keepBtn').style.display=canKeep?'inline-block':'none';
  o.style.display='flex';
}

function undo(){
  if(!prev||locked)return;
  clearTiles();
  prev.tiles.forEach(t=>addTile(t.v,t.r,t.c,false));
  score=prev.score;prev=null;over=false;
  document.getElementById('over').style.display='none';hud();
}

document.addEventListener('keydown',e=>{
  const k=e.key;
  const map={ArrowUp:0,w:0,W:0,ArrowRight:1,d:1,D:1,ArrowDown:2,s:2,S:2,ArrowLeft:3,a:3,A:3};
  if(k in map){e.preventDefault();move(map[k]);}
  else if(k==='u'||k==='U')undo();
  else if(k==='n'||k==='N')newGame();
});
let sx=0,sy=0;
board.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
board.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
board.addEventListener('touchend',e=>{
  const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:3);else move(dy>0?2:0);
},{passive:true});
document.getElementById('newBtn').addEventListener('click',newGame);
document.getElementById('againBtn').addEventListener('click',newGame);
document.getElementById('undoBtn').addEventListener('click',undo);
document.getElementById('keepBtn').addEventListener('click',()=>{keepGoing=true;document.getElementById('over').style.display='none';});
document.getElementById('sizeSel').addEventListener('change',newGame);
window.addEventListener('resize',()=>{layout();buildBg();tiles.forEach(t=>{styleTile(t);place(t);});});
newGame();
</script>
</body>
</html>
