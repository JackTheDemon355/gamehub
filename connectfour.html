<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="google-site-verification" content="1rNDahd3JgJCYe4UGAdNJqAAZM_oOawfSZ-I2i2_mPs" />

<title>CONNECT 4 — GAME HUB</title>
<style>
:root{--bg:#03030c;--cyan:#00fff2;--yellow:#ffe600;--green:#39ff14;--red:#ff003c;--mag:#ff2fd0;--sub:#b9c4cc;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(--bg);font-family:'Consolas','Courier New',monospace;color:#fff;
  background-image:radial-gradient(ellipse at 30% 0%,#0a0a2e,transparent 55%),radial-gradient(ellipse at 80% 100%,#0a001a,transparent 55%);}
body{display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,255,242,.02) 0,rgba(0,255,242,.02) 1px,transparent 1px,transparent 4px);}
#back{position:fixed;top:12px;left:12px;z-index:50;color:var(--cyan);text-decoration:none;border:1px solid var(--cyan);padding:7px 14px;font-size:11px;letter-spacing:2px;border-radius:4px;background:rgba(0,0,0,.7);}
#back:hover{background:var(--cyan);color:#000;}
header{text-align:center;padding:18px 10px 2px;position:relative;z-index:1;}
header h1{font-size:clamp(22px,5vw,38px);letter-spacing:8px;color:var(--cyan);text-shadow:0 0 12px var(--cyan),0 0 30px rgba(0,255,242,.35);}
header p{font-size:10px;letter-spacing:4px;color:var(--mag);margin-top:4px;}
#bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;padding:10px 12px 2px;position:relative;z-index:1;}
.btn{cursor:pointer;background:transparent;border:1px solid rgba(0,255,242,.3);color:var(--sub);padding:7px 13px;font-family:inherit;font-size:11px;letter-spacing:2px;border-radius:4px;transition:.15s;}
.btn:hover,.btn.on{border-color:var(--cyan);color:var(--cyan);}
.btn.go{border-color:var(--yellow);color:var(--yellow);}.btn.go:hover{background:var(--yellow);color:#000;}
#score{display:flex;gap:18px;font-size:12px;letter-spacing:2px;padding:8px;position:relative;z-index:1;}
.p1{color:var(--cyan);}.p2{color:var(--mag);}.dr{color:var(--sub);}
#status{font-size:15px;letter-spacing:3px;min-height:26px;padding:2px 10px;text-align:center;position:relative;z-index:1;}
#c{display:block;width:min(96vw,calc((100vh - 260px) * 1),620px);height:auto;aspect-ratio:1/1;position:relative;z-index:1;touch-action:manipulation;cursor:pointer;}
#help{font-size:10px;letter-spacing:1px;color:#556;text-align:center;max-width:460px;line-height:1.9;padding:6px 14px 28px;position:relative;z-index:1;}
</style>
</head>
<body>
<a id="back" href="index.html">◄ HUB</a>
<header><h1>CONNECT 4</h1><p>◄ GET FOUR IN A ROW ►</p></header>

<div id="bar">
  <button class="btn on" data-m="cpu">VS CPU</button>
  <button class="btn" data-m="2p">2 PLAYERS</button>
  <span style="width:8px"></span>
  <button class="btn on" data-d="easy" id="dEasy">EASY</button>
  <button class="btn" data-d="medium" id="dMed">MEDIUM</button>
  <button class="btn" data-d="hard" id="dHard">HARD</button>
  <button class="btn go" id="newBtn">↻ NEW</button>
</div>
<div id="score">
  <span class="p1" id="s1">P1: 0</span><span class="dr" id="sd">DRAWS: 0</span><span class="p2" id="s2">CPU: 0</span>
</div>
<div id="status"></div>
<canvas id="c" width="700" height="700"></canvas>
<div id="help">Click / tap a column to drop a disc · ← → to move, Space / Enter / ↓ to drop · Keys 1–7 drop directly.</div>

<script>
(function(){var P=['gamehub234','oscarmccumstie','user13579'];function isSH(){var n=new Date(),a=new Date(n.getTime()+28800000),d=a.getUTCDay();if(!d||d===6)return false;var m=a.getUTCHours()*60+a.getUTCMinutes();return m>=495&&m<915;}function chk(){fetch('lock.json?nc='+Date.now()).then(r=>r.json()).then(d=>{if(d.locked===true||d.school_hours_lock===true&&isSH())showL(d.message||'Locked.');}).catch(()=>{});}function showL(msg){var el=document.createElement('div');el.style.cssText='position:fixed;inset:0;background:#03030c;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Consolas,monospace;color:#00fff2;text-align:center;gap:14px;padding:24px;';el.innerHTML='<div style="font-size:40px;color:#ff003c;letter-spacing:6px;font-weight:bold">LOCKED 🔒</div><div style="font-size:13px;color:#888;max-width:460px;line-height:1.7">'+msg+'</div><div style="font-size:11px;color:#334">Hold SHIFT + key · tap 3×</div>';document.body.appendChild(el);document.body.style.overflow='hidden';var sh=false;document.addEventListener('keydown',function kd(e){if(e.key==='Shift'){sh=true;return;}if(sh){document.removeEventListener('keydown',kd);pw(el);}});var t=0,tc=0;el.addEventListener('click',function(){var n=Date.now();if(n-t>700)tc=0;t=n;if(++tc>=3){tc=0;pw(el);}});}function pw(el){el.innerHTML='<div style="font-size:30px;color:#ffe600;letter-spacing:6px;font-weight:bold">PASSWORD 🔑</div><input id="lpi" type="password" autocomplete="off" style="background:rgba(0,0,0,.65);border:2px solid rgba(0,255,242,.4);color:#fff;padding:13px 20px;font-family:Consolas,monospace;font-size:20px;letter-spacing:6px;border-radius:6px;outline:none;width:280px;text-align:center;" placeholder="••••••••"><button id="lpb" style="background:transparent;color:#00fff2;border:2px solid #00fff2;padding:11px 28px;font-family:Consolas,monospace;font-size:14px;letter-spacing:3px;border-radius:4px;cursor:pointer;margin-top:4px;">▶ UNLOCK</button><div id="lpe" style="color:#ff003c;font-size:12px;min-height:18px;"></div>';var i=document.getElementById('lpi'),b=document.getElementById('lpb'),e=document.getElementById('lpe');i.focus();function go(){if(P.map(p=>p.toLowerCase()).indexOf((i.value||'').trim().toLowerCase())>=0){el.remove();document.body.style.overflow='';}else{e.textContent='Incorrect';i.value='';i.focus();setTimeout(()=>e.textContent='',2200);}}b.addEventListener('click',go);i.addEventListener('keydown',ev=>{if(ev.key==='Enter')go();});}chk();})();

const COLS=7,ROWS=6,CELL=100,W=COLS*CELL,H=(ROWS+1)*CELL,RAD=CELL*.4;
const COLORS={1:['#c8fffd','#00fff2','#007a80'],2:['#ffd0f4','#ff2fd0','#80106a']};
const ORDER=[3,2,4,1,5,0,6];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const statusEl=document.getElementById('status');
let board,turn=1,starter=1,over=false,winLine=null,anim=null,hover=3,mode='cpu',diff='easy',thinking=false,drawFlag=false,pulse=0,last=0;
let sc={1:0,2:0,d:0};
try{const s=JSON.parse(localStorage.getItem('c4_score'));if(s&&typeof s==='object')sc={1:s[1]||0,2:s[2]||0,d:s.d||0};}catch(e){}

function emptyBoard(){return Array.from({length:ROWS},()=>Array(COLS).fill(0));}
function dropRow(b,c){for(let r=ROWS-1;r>=0;r--)if(b[r][c]===0)return r;return -1;}
function findWin(b,p){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)for(const [dr,dc] of dirs){
    const cells=[];
    for(let k=0;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=ROWS||cc<0||cc>=COLS||b[rr][cc]!==p){cells.length=0;break;}cells.push([rr,cc]);}
    if(cells.length===4)return cells;
  }
  return null;
}

// ── CPU (minimax with alpha-beta; CPU = player 2) ──
function validCols(b){return ORDER.filter(c=>b[0][c]===0);}
function dropPiece(b,c,p){for(let r=ROWS-1;r>=0;r--)if(b[r][c]===0){b[r][c]=p;return r;}return -1;}
function undrop(b,c){for(let r=0;r<ROWS;r++)if(b[r][c]!==0){b[r][c]=0;return;}}
function evalWindow(w,p){
  const o=p===2?1:2;let pc=0,oc=0,ec=0;
  for(const x of w){if(x===p)pc++;else if(x===o)oc++;else ec++;}
  if(pc===4)return 100000;
  if(pc===3&&ec===1)return 100;
  if(pc===2&&ec===2)return 10;
  if(oc===3&&ec===1)return -90;
  return 0;
}
function scoreBoard(b,p){
  let s=0;
  for(let r=0;r<ROWS;r++)if(b[r][3]===p)s+=6;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(c+3<COLS)s+=evalWindow([b[r][c],b[r][c+1],b[r][c+2],b[r][c+3]],p);
    if(r+3<ROWS)s+=evalWindow([b[r][c],b[r+1][c],b[r+2][c],b[r+3][c]],p);
    if(r+3<ROWS&&c+3<COLS)s+=evalWindow([b[r][c],b[r+1][c+1],b[r+2][c+2],b[r+3][c+3]],p);
    if(r+3<ROWS&&c-3>=0)s+=evalWindow([b[r][c],b[r+1][c-1],b[r+2][c-2],b[r+3][c-3]],p);
  }
  return s;
}
function minimax(b,depth,alpha,beta,maxing){
  if(findWin(b,2))return{s:1e6+depth,c:null};
  if(findWin(b,1))return{s:-1e6-depth,c:null};
  const v=validCols(b);
  if(!v.length)return{s:0,c:null};
  if(depth===0)return{s:scoreBoard(b,2),c:null};
  if(maxing){
    let best={s:-Infinity,c:v[0]};
    for(const c of v){
      dropPiece(b,c,2);const r=minimax(b,depth-1,alpha,beta,false);undrop(b,c);
      if(r.s>best.s)best={s:r.s,c};
      alpha=Math.max(alpha,best.s);if(alpha>=beta)break;
    }
    return best;
  }
  let best={s:Infinity,c:v[0]};
  for(const c of v){
    dropPiece(b,c,1);const r=minimax(b,depth-1,alpha,beta,true);undrop(b,c);
    if(r.s<best.s)best={s:r.s,c};
    beta=Math.min(beta,best.s);if(alpha>=beta)break;
  }
  return best;
}
function cpuChoose(){
  const v=validCols(board);
  if(diff==='easy'&&Math.random()<.35)return v[Math.floor(Math.random()*v.length)];
  const depth={easy:2,medium:4,hard:6}[diff];
  return minimax(board.map(r=>r.slice()),depth,-Infinity,Infinity,true).c;
}

// ── Game flow ──
function setStatus(){
  if(over){
    if(drawFlag){statusEl.style.color='var(--sub)';statusEl.textContent='IT\'S A DRAW';}
    else{const w=turn;statusEl.style.color=w===1?'var(--cyan)':'var(--mag)';
      statusEl.textContent=(w===1?(mode==='cpu'?'YOU WIN! 🎉':'PLAYER 1 WINS! 🎉'):(mode==='cpu'?'CPU WINS 🤖':'PLAYER 2 WINS! 🎉'));}
    return;
  }
  if(thinking){statusEl.style.color='var(--mag)';statusEl.textContent='CPU THINKING…';return;}
  statusEl.style.color=turn===1?'var(--cyan)':'var(--mag)';
  statusEl.textContent=turn===1?(mode==='cpu'?'YOUR TURN':'PLAYER 1'):(mode==='cpu'?'CPU TURN':'PLAYER 2');
}
function setScore(){
  document.getElementById('s1').textContent=(mode==='cpu'?'YOU':'P1')+': '+sc[1];
  document.getElementById('s2').textContent=(mode==='cpu'?'CPU':'P2')+': '+sc[2];
  document.getElementById('sd').textContent='DRAWS: '+sc.d;
}
function saveScore(){try{localStorage.setItem('c4_score',JSON.stringify(sc));}catch(e){}}

function newGame(){
  board=emptyBoard();over=false;winLine=null;anim=null;thinking=false;drawFlag=false;
  starter=starter===1?2:1;turn=starter;
  setScore();setStatus();
  if(mode==='cpu'&&turn===2)cpuTurn();
}
function cpuTurn(){
  thinking=true;setStatus();
  setTimeout(()=>{
    if(over||mode!=='cpu')return;
    const c=cpuChoose();thinking=false;
    startDrop(c);
  },420);
}
function startDrop(c){
  const r=dropRow(board,c);if(r<0||anim||over)return false;
  anim={c,r,y:CELL*.5,vy:0,p:turn};hover=c;return true;
}
function humanDrop(c){
  if(over||anim||thinking)return;
  if(mode==='cpu'&&turn!==1)return;
  startDrop(c);
}
function land(){
  const {c,r,p}=anim;board[r][c]=p;anim=null;
  const w=findWin(board,p);
  if(w){over=true;winLine=w;sc[p]++;saveScore();setScore();setStatus();return;}
  if(!validCols(board).length){over=true;drawFlag=true;sc.d++;saveScore();setScore();setStatus();return;}
  turn=p===1?2:1;setStatus();
  if(mode==='cpu'&&turn===2)cpuTurn();
}

function disc(x,y,p,alpha){
  const col=COLORS[p];
  ctx.globalAlpha=alpha==null?1:alpha;
  const g=ctx.createRadialGradient(x-RAD*.3,y-RAD*.3,RAD*.1,x,y,RAD);
  g.addColorStop(0,col[0]);g.addColorStop(.55,col[1]);g.addColorStop(1,col[2]);
  ctx.fillStyle=g;ctx.shadowColor=col[1];ctx.shadowBlur=16;
  ctx.beginPath();ctx.arc(x,y,RAD,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.globalAlpha=1;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // hover disc
  if(!over&&!anim&&!thinking&&(mode==='2p'||turn===1))disc(hover*CELL+CELL/2,CELL/2,turn,.55);
  // placed discs
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(board[r][c])disc(c*CELL+CELL/2,(r+1)*CELL+CELL/2,board[r][c]);
  // falling disc
  if(anim)disc(anim.c*CELL+CELL/2,anim.y,anim.p);
  // board overlay with holes
  ctx.beginPath();ctx.rect(0,CELL,W,ROWS*CELL);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const cx=c*CELL+CELL/2,cy=(r+1)*CELL+CELL/2;ctx.moveTo(cx+RAD,cy);ctx.arc(cx,cy,RAD,0,Math.PI*2);}
  const bg=ctx.createLinearGradient(0,CELL,0,H);bg.addColorStop(0,'#101a4a');bg.addColorStop(1,'#1a0a40');
  ctx.fillStyle=bg;ctx.fill('evenodd');
  ctx.strokeStyle='rgba(0,255,242,.55)';ctx.lineWidth=3;ctx.shadowColor='#00fff2';ctx.shadowBlur=10;
  ctx.strokeRect(1.5,CELL+1.5,W-3,ROWS*CELL-3);ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(0,255,242,.18)';ctx.lineWidth=2;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ctx.beginPath();ctx.arc(c*CELL+CELL/2,(r+1)*CELL+CELL/2,RAD+1,0,Math.PI*2);ctx.stroke();}
  // winning line highlight
  if(winLine){
    const a=.55+.45*Math.sin(pulse*6);
    ctx.strokeStyle='rgba(255,230,0,'+a+')';ctx.lineWidth=7;ctx.shadowColor='#ffe600';ctx.shadowBlur=18;
    winLine.forEach(([r,c])=>{ctx.beginPath();ctx.arc(c*CELL+CELL/2,(r+1)*CELL+CELL/2,RAD+2,0,Math.PI*2);ctx.stroke();});
    ctx.shadowBlur=0;
  }
}

function loop(ts){
  if(!last)last=ts;
  const dt=Math.min((ts-last)/1000,.04);last=ts;pulse+=dt;
  if(anim){
    anim.vy+=3200*dt;anim.y+=anim.vy*dt;
    const ty=(anim.r+1)*CELL+CELL/2;
    if(anim.y>=ty){anim.y=ty;land();}
  }
  draw();requestAnimationFrame(loop);
}

// ── Input ──
function colFromEvent(e){const rect=cv.getBoundingClientRect();return Math.max(0,Math.min(COLS-1,Math.floor((e.clientX-rect.left)/rect.width*COLS)));}
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')hover=colFromEvent(e);});
cv.addEventListener('pointerdown',e=>{e.preventDefault();hover=colFromEvent(e);humanDrop(hover);});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){hover=(hover+COLS-1)%COLS;e.preventDefault();}
  else if(e.key==='ArrowRight'){hover=(hover+1)%COLS;e.preventDefault();}
  else if(e.key===' '||e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();humanDrop(hover);}
  else if(e.key>='1'&&e.key<='7'){hover=parseInt(e.key)-1;humanDrop(hover);}
  else if(e.key==='n'||e.key==='N')newGame();
});
document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{
  mode=b.dataset.m;
  document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));
  ['dEasy','dMed','dHard'].forEach(id=>document.getElementById(id).style.display=mode==='cpu'?'':'none');
  starter=2;newGame();
}));
document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{
  diff=b.dataset.d;
  document.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x===b));
  starter=2;newGame();
}));
document.getElementById('newBtn').addEventListener('click',newGame);
starter=2;newGame();requestAnimationFrame(loop);
</script>
</body>
</html>
